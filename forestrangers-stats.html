<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1c1f14; --surface: #252a1a; --surface2: #2f3520; --surface3: #3d4429;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #eceee6; --text-dim: rgba(236,238,230,0.5); --text-faint: rgba(236,238,230,0.28);
  --accent: #ff5f1f; --accent-dim: rgba(255,95,31,0.12); --accent-mid: rgba(255,95,31,0.25);
  --green: #5ec97a; --green-dim: rgba(94,201,122,0.12);
  --red: #e05a5a; --red-dim: rgba(224,90,90,0.12);
  --blue: #5a9ae0; --blue-dim: rgba(90,154,224,0.12);
  --amber: #f0b429; --amber-dim: rgba(240,180,41,0.12);
  --radius: 10px; --radius-lg: 14px;
}

/* ── MODE CLAIR (classe html.light, cle 'fr-theme' partagee) ── */
html.light {
  --bg: #f4f5f0; --surface: #ffffff; --surface2: #eef0e8; --surface3: #d6dac8;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
  --text: #1c1f14; --text-dim: rgba(28,31,20,0.55); --text-faint: rgba(28,31,20,0.33);
  --accent-dim: rgba(255,95,31,0.10); --accent-mid: rgba(255,95,31,0.22);
  --green: #2e7d32; --green-dim: rgba(46,125,50,0.10);
  --red: #c62828; --red-dim: rgba(198,40,40,0.10);
  --blue: #1565c0; --blue-dim: rgba(21,101,192,0.10);
  --amber: #b45000; --amber-dim: rgba(180,80,0,0.12);
}
html.light body { background: var(--bg) !important; color: var(--text) !important; }
html, body { min-height: 100vh; font-family: 'Instrument Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

/* ── HEADER ── */
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.back-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
  color: var(--text-dim); font-size: 12px; font-weight: 600;
  text-decoration: none; transition: all 0.15s;
}
.back-btn:hover { color: var(--text); border-color: var(--border2); }
.page-title { font-family: 'FRDisplay', 'Oswald', 'Arial Narrow', sans-serif; font-size: 18px; font-weight: 800; }

/* ── FILTRES ── */
.filters-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  position: sticky; top: 56px; z-index: 99;
}
.filter-select {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; color: var(--text);
  font-family: 'Instrument Sans', sans-serif; font-size: 12px;
  cursor: pointer; outline: none; transition: border-color 0.15s;
}
.filter-select:focus { border-color: var(--accent); }
.filter-label { font-size: 11px; color: var(--text-faint); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
.filter-sep { width: 1px; height: 20px; background: var(--border2); margin: 0 4px; }
.btn-reset { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; color: var(--text-dim); font-family: 'FRDisplay', 'Oswald', 'Arial Narrow', sans-serif; font-size: 11px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; }
.btn-reset:hover { border-color: var(--accent); color: var(--accent); }

/* ── LAYOUT ── */
.content { padding: 20px 24px 40px; max-width: 1200px; }
.section-title { font-family: 'FRDisplay', 'Oswald', 'Arial Narrow', sans-serif; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-faint); margin-bottom: 10px; margin-top: 24px; display: flex; align-items: center; gap: 8px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.grid { display: grid; gap: 10px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-5 { grid-template-columns: repeat(5, 1fr); }   /* v2.90 : vue rapide */
@media (max-width: 1100px) { .grid-5 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 600px) { .grid-5 { grid-template-columns: 1fr 1fr; } .grid-5 > :last-child:nth-child(odd) { grid-column: 1 / -1; } }
@media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } .filters-bar { padding: 10px 14px; } .content { padding: 14px 14px 80px; } }

/* ── KPI CARDS ── */
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px;
  position: relative; overflow: hidden;
}
.kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
.kpi.green::before { background: var(--green); }
.kpi.accent::before { background: var(--accent); }
.kpi.blue::before { background: var(--blue); }
.kpi.red::before { background: var(--red); }
.kpi.amber::before { background: var(--amber); }
.kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
.kpi-val { font-family: 'FRDisplay', 'Oswald', 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
.kpi-sub { font-size: 11px; color: var(--text-faint); }
.kpi.green .kpi-val { color: var(--green); }
.kpi.accent .kpi-val { color: var(--accent); }
.kpi.blue .kpi-val { color: var(--blue); }
.kpi.red .kpi-val { color: var(--red); }
.kpi.amber .kpi-val { color: var(--amber); }
.kpi-delta { font-size: 11px; font-weight: 700; margin-top: 6px; padding: 3px 8px; border-radius: 20px; display: inline-block; }
.kpi-delta.up { background: var(--green-dim); color: var(--green); }
.kpi-delta.down { background: var(--red-dim); color: var(--red); }
.kpi-delta.neutral { background: var(--surface2); color: var(--text-dim); }

/* ── CARDS ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-family: 'FRDisplay', 'Oswald', 'Arial Narrow', sans-serif; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); }
.card-body { padding: 14px 16px; }

/* ── BARRES ── */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-label { font-size: 12px; color: var(--text-dim); width: 90px; flex-shrink: 0; text-align: right; }
.bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.bar-val { font-size: 12px; font-weight: 700; width: 60px; text-align: right; flex-shrink: 0; }
/* v2.89 : facturé par service — libellés et montants plus longs */
.fac-svc .bar-label { width: 150px; }
.fac-svc .bar-val { width: 120px; }
@media (max-width: 600px) { .fac-svc .bar-label { width: 96px; } .fac-svc .bar-val { width: 104px; font-size: 11px; } }

/* ── TABLE ── */
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { font-family: 'FRDisplay', 'Oswald', 'Arial Narrow', sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-faint); padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 700; }
.tbl th.num, .tbl td.num { text-align: right; white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: var(--surface2); }
.tbl td.main { color: var(--text); font-weight: 500; }
.badge { font-family: 'FRDisplay', 'Oswald', 'Arial Narrow', sans-serif; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.08em; display: inline-block; }
.b-green  { background: var(--green-dim);  color: var(--green); border: 1px solid rgba(94,201,122,0.25); }
.b-red    { background: var(--red-dim);    color: var(--red);   border: 1px solid rgba(224,90,90,0.25); }
.b-accent { background: var(--accent-dim); color: var(--accent);border: 1px solid var(--accent-mid); }
.b-blue   { background: var(--blue-dim);   color: var(--blue);  border: 1px solid rgba(90,154,224,0.25); }
.b-amber  { background: var(--amber-dim);  color: var(--amber); border: 1px solid rgba(240,180,41,0.25); }
.b-muted  { background: var(--surface2);   color: var(--text-dim); border: 1px solid var(--border2); }

/* ── EMPTY STATE ── */
.empty { padding: 32px; text-align: center; color: var(--text-faint); font-size: 13px; }
.loading { padding: 20px; text-align: center; color: var(--text-faint); font-size: 13px; }

/* ── COMPARAISON ── */
.cmp-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.cmp-row:last-child { border-bottom: none; }
.cmp-label { color: var(--text-dim); }
.cmp-vals { display: flex; gap: 16px; }
.cmp-val { font-weight: 600; }
.cmp-prev { color: var(--text-faint); font-size: 11px; }
/* ── v2.32 : barre de filtres non collante, graphiques, carte de chaleur ── */
.filters-bar { position: static !important; }
.filter-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; color: var(--text); font-family: 'Instrument Sans', sans-serif; font-size: 12px; }
.chart-box { position: relative; height: 240px; }
.chart-box.small { height: 190px; }
.card-note { font-size: 11px; color: var(--text-faint); margin-top: 8px; line-height: 1.45; }
.seg { display: inline-flex; background: var(--surface2); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--text-dim); font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 6px; cursor: pointer; font-family: 'Instrument Sans', sans-serif; }
.seg button.on { background: var(--surface); color: var(--accent); }
.heat { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 11px; }
.heat th { color: var(--text-faint); font-weight: 600; text-align: center; padding: 2px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.heat th.l { text-align: right; padding-right: 6px; white-space: nowrap; }
.heat td { height: 38px; border-radius: 6px; text-align: center; font-weight: 700; color: var(--text); background: var(--surface2); min-width: 38px; }
.heat td.z { color: var(--text-faint); font-weight: 400; }
.mini-list { font-size: 12px; }
.mini-list .row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--text-dim); }
.mini-list .row:last-child { border-bottom: 0; }
.mini-list .row b { color: var(--text); font-weight: 600; }
.van-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.van { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
.van-t { font-family: 'FRDisplay', 'Oswald', 'Arial Narrow', sans-serif; font-size: 15px; color: var(--text); }
.van-s { font-size: 11px; color: var(--text-faint); margin-bottom: 10px; }
.info-note { background: var(--amber-dim); color: var(--text); border: 1px solid rgba(240,180,41,0.3); border-radius: 10px; padding: 10px 14px; font-size: 12px; line-height: 1.5; }
.tbl-wrap { overflow-x: auto; }
.grid-21 { grid-template-columns: 2fr 1fr; }
.card-head { flex-wrap: wrap; gap: 8px; }
@media (max-width: 900px) { .grid-21 { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .chart-box { height: 210px; } .heat td { height: 32px; min-width: 30px; } .filter-sep { display: none; } }
</style>
</head>

<script>
  // ── Init resiliente (correctif : "Cannot access 'db' before initialization") ──
  // Le SDK Supabase vient d'un CDN. Sur reseau faible il peut ne pas arriver :

    function poser() { document.body.insertAdjacentHTML('beforeend', html); }

// ── DATES ──
function pad(n) { return (n < 10 ? '0' : '') + n; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseISO(s) { var p = String(s).slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addJ(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function finMois(an, m0) { return iso(new Date(an, m0 + 1, 0)); }
function debMois(an, m0) { return iso(new Date(an, m0, 1)); }
function perDe(an, m0) { var d = new Date(an, m0, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function moisEntre(debut, fin) {
  var out = [], d = parseISO(debut); d.setDate(1);
  var z = parseISO(fin);
  while (d <= z) { out.push(d.getFullYear() + '-' + pad(d.getMonth() + 1)); d.setMonth(d.getMonth() + 1); }
  return out;
}
function nbJours(debut, fin) { return Math.round((parseISO(fin) - parseISO(debut)) / 86400000) + 1; }
function dateFr(s, an) { var d = parseISO(s); return d.getDate() + ' ' + MOIS_C[d.getMonth()] + (an ? ' ' + d.getFullYear() : ''); }
function moisCourt(per) { var p = per.split('-'); return MOIS_C[+p[1] - 1] + ' ' + p[0].slice(2); }
function auj() { return iso(new Date()); }

function bornes() {
  var n = new Date(), an = n.getFullYear(), m = n.getMonth();
  var p = filters.periode, b = {};
  if (p === 'mois') { b.debut = debMois(an, m); b.fin = finMois(an, m); b.label = MOIS_L[m] + ' ' + an; }
  else if (p === 'mois_prec') { var d1 = new Date(an, m - 1, 1); b.debut = iso(d1); b.fin = finMois(d1.getFullYear(), d1.getMonth()); b.label = MOIS_L[d1.getMonth()] + ' ' + d1.getFullYear(); }
  else if (p === 'semaine') { var dow = (n.getDay() + 6) % 7; var l = new Date(an, m, n.getDate() - dow); b.debut = iso(l); b.fin = addJ(b.debut, 6); b.label = 'semaine du ' + dateFr(b.debut); }
  else if (p === 'trimestre') { var q = Math.floor(m / 3); b.debut = debMois(an, q * 3); b.fin = finMois(an, q * 3 + 2); b.label = 'T' + (q + 1) + ' ' + an; }
  else if (p === 'annee') { b.debut = an + '-01-01'; b.fin = an + '-12-31'; b.label = String(an); }
  else if (p === '12m') { b.debut = debMois(an, m - 11); b.fin = finMois(an, m); b.label = '12 derniers mois'; }
  else {
    b.debut = filters.du || debMois(an, m); b.fin = filters.au || finMois(an, m);
    if (b.fin < b.debut) { var t = b.debut; b.debut = b.fin; b.fin = t; }
    b.label = dateFr(b.debut, true) + ' – ' + dateFr(b.fin, true);
  }
  // Période précédente de même nature
  if (p === 'mois' || p === 'mois_prec' || p === 'trimestre' || p === '12m') {
    var k = p === 'trimestre' ? 3 : p === '12m' ? 12 : 1;
    var d0 = parseISO(b.debut);
    b.prevDebut = debMois(d0.getFullYear(), d0.getMonth() - k);
    b.prevFin = addJ(b.debut, -1);
  } else if (p === 'annee') { b.prevDebut = (an - 1) + '-01-01'; b.prevFin = (an - 1) + '-12-31'; }
  else { var len = nbJours(b.debut, b.fin); b.prevFin = addJ(b.debut, -1); b.prevDebut = addJ(b.prevFin, -(len - 1)); }
  b.labelPrev = (p === 'annee') ? String(an - 1) : (p === 'mois' || p === 'mois_prec') ? MOIS_L[parseISO(b.prevDebut).getMonth()] : 'période préc.';
  return b;
}

// ── CHARGEMENT ──
async function toutLire(fabrique) {
  var out = [], pas = 1000;
  for (var i = 0; i < 50; i++) {
    var r = await fabrique().range(i * pas, i * pas + pas - 1);
    if (r.error) throw r.error;
    out = out.concat(r.data || []);
    if (!r.data || r.data.length < pas) break;
  }
  return out;
}
async function lireOuVide(fabrique) { try { return await toutLire(fabrique); } catch (e) { return []; } }

async function chargerDonnees(debut, fin) {
  if (!window.FR_FACT) throw new Error('fr-facturation.js indisponible');
  await FR_FACT.chargerTarifs(db);
  if (window.FR_CAL && FR_CAL.charger && !FR_CAL.estCharge()) { try { await FR_CAL.charger(db); } catch (e) {} }
  var res = await Promise.all([
    toutLire(function() { return db.from('clients').select('*').order('nom'); }),
    toutLire(function() { return db.from('chiens').select('id, nom, actif, client_id, poids_kg, created_at').order('created_at'); }),
    toutLire(function() { return db.from('reservations').select('*').lte('date_debut', fin).order('date_debut'); }),
    toutLire(function() { return db.from('factures').select('id, client_id, numero, periode, total_ttc, montant_paye, statut, date_emission, date_paiement, mensuelle, notes, lignes').order('periode'); }),
    lireOuVide(function() { return db.from('v_factures_suivi').select('id, client_id, solde, jours_retard'); }),
    lireOuVide(function() { return db.from('paiements').select('id, client_id, date_virement, montant, annule_le').gte('date_virement', debut); }),
    lireOuVide(function() { return db.from('staff').select('id, prenom, nom, actif').order('prenom'); }),
    lireOuVide(function() { return db.from('camionnettes').select('*').order('nom'); }),
    lireOuVide(function() { return db.from('kilometrage').select('*').gte('date', debut); }),
    lireOuVide(function() { return db.from('attributions_camionnettes').select('*').gte('date_jour', debut).lte('date_jour', fin); }),
    lireOuVide(function() { return db.from('factures_historique').select('*').order('periode'); })   // v2.89 : anciens clients sans fiche
  ]);
  var clients = res[0].filter(function(c) { return !c.is_test; });
  var okC = {}; clients.forEach(function(c) { okC[c.id] = c; });
  var resas = res[2].filter(function(r) {
    if (!okC[r.client_id] || !r.date_debut) return false;
    var f = String(r.date_fin_recurrence || r.date_fin || r.date_debut).slice(0, 10);
    return f >= debut;
  });
  // Annulations à l'unité (par lots de 150 réservations)
  var ann = [], ids = resas.map(function(r) { return r.id; });
  for (var i = 0; i < ids.length; i += 150) {
    try {
      var a = await db.from('annulations_occurrences').select('reservation_id, date_occurrence, annule_par, annulation_tardive, facture_pourcentage')
        .in('reservation_id', ids.slice(i, i + 150)).gte('date_occurrence', debut).lte('date_occurrence', fin);
      if (!a.error && a.data) ann = ann.concat(a.data);
    } catch (e) {}
  }
  var D = { debut: debut, fin: fin, clients: clients, clientParId: okC,
    chiens: res[1].filter(function(c) { return okC[c.client_id]; }),
    resas: resas, annulations: ann,
    factures: res[3].filter(function(f) { return okC[f.client_id]; }),
    suivi: {}, paiements: res[5].filter(function(p) { return okC[p.client_id] && !p.annule_le; }),
    staff: res[6], camionnettes: res[7], km: res[8], attributions: res[9] };
  res[4].forEach(function(s) { D.suivi[s.id] = s; });
  // v2.89 : factures d'anciens clients sans fiche (migration v65). Elles
  // comptent dans le facturé, le graphique et le top clients, sous le nom
  // de la facture ; jamais dans les listes de clients ni le planning.
  (res[10] || []).forEach(function(h) {
    var cid = 'ancien-' + h.numero_client;
    if (!D.clientParId[cid]) D.clientParId[cid] = { id: cid, prenom: h.client_nom || ('Client ' + h.numero_client), nom: '', ancien: true, chiens: h.chiens };
    D.factures.push({ id: 'hist-' + h.numero, client_id: cid, numero: h.numero, periode: h.periode, total_ttc: +h.total_ttc || 0,
      montant_paye: +h.total_ttc || 0, statut: 'payee', date_emission: h.date_emission, mensuelle: false, lignes: h.lignes, ancien: true });
  });
  // v2.71 : comptes test — hors de toutes les statistiques, résumés à part
  var testeurs = res[0].filter(function(c) { return c.is_test; }), okT = {};
  testeurs.forEach(function(c) { okT[c.id] = c; });
  var resasT = res[2].filter(function(r) { return okT[r.client_id] && r.date_debut && String(r.date_fin_recurrence || r.date_fin || r.date_debut).slice(0, 10) >= debut; });
  var annT = [], idsT = resasT.map(function(r) { return r.id; });
  for (var k = 0; k < idsT.length; k += 150) {
    try {
      var at = await db.from('annulations_occurrences').select('reservation_id, date_occurrence, annule_par, annulation_tardive, facture_pourcentage')
        .in('reservation_id', idsT.slice(k, k + 150)).gte('date_occurrence', debut).lte('date_occurrence', fin);
      if (!at.error && at.data) annT = annT.concat(at.data);
    } catch (e) {}
  }
  D.testeurs = { clients: testeurs, resas: resasT, annulations: annT,
    chiens: res[1].filter(function(c) { return okT[c.client_id]; }),
    factures: res[3].filter(function(f) { return okT[f.client_id]; }) };
  D.chiensParClient = {}; D.chiens.forEach(function(c) { (D.chiensParClient[c.client_id] = D.chiensParClient[c.client_id] || []).push(c); });
  D.resasParClient = {}; D.resas.forEach(function(r) { (D.resasParClient[r.client_id] = D.resasParClient[r.client_id] || []).push(r); });
  D.annParResa = {}; ann.forEach(function(a) { (D.annParResa[a.reservation_id] = D.annParResa[a.reservation_id] || []).push(a); });
  D.cache = {};
  return D;
}

// ── FILTRES DE RÉSERVATION ──
function resaPasse(r, opt) {
  if (opt.service && r.service !== opt.service) return false;
  if (opt.ranger) {
    if (opt.ranger === '__aucun') return !r.ranger_id && !r.ranger_nom;
    if (r.ranger_id) return r.ranger_id === opt.ranger;
    var s = (ST.staff || []).find(function(x) { return x.id === opt.ranger; });
    return !!(s && r.ranger_nom && r.ranger_nom.trim().toLowerCase() === String(s.prenom || '').trim().toLowerCase());
  }
  return true;
}

// Calcul d'une période : séances, lignes et totaux, tous clients
function calc(debut, fin, opt) {
  opt = opt || { service: filters.service, ranger: filters.ranger };
  var cle = debut + '|' + fin + '|' + (opt.service || '') + '|' + (opt.ranger || '');
  if (ST.cache[cle]) return ST.cache[cle];
  var out = { debut: debut, fin: fin, seances: [], lignes: [], total: 0, parClient: {} };
  ST.clients.forEach(function(c) {
    var rs = (ST.resasParClient[c.id] || []).filter(function(r) {
      if (!resaPasse(r, opt)) return false;
      if (String(r.date_debut).slice(0, 10) > fin) return false;
      return String(r.date_fin_recurrence || r.date_fin || r.date_debut).slice(0, 10) >= debut;
    });
    if (!rs.length) return;
    var an = []; rs.forEach(function(r) { an = an.concat(ST.annParResa[r.id] || []); });
    var res = FR_FACT.calculer({ client: c, chiens: ST.chiensParClient[c.id] || [], reservations: rs, annulations: an }, debut, fin, {});
    if (!res.seances.length && !res.lignes.length) return;
    res.seances.forEach(function(s) { s.client = c; out.seances.push(s); });
    res.lignes.forEach(function(l) { l.client = c; out.lignes.push(l); });
    out.total += res.total_ttc;
    out.parClient[c.id] = res;
  });
  ST.cache[cle] = out;
  return out;
}

function agreger(C) {
  var a = { sorties: { walking: 0, daycare: 0, boarding: 0 }, chiens: { walking: 0, daycare: 0, boarding: 0 },
    valeur: C.total, realise: 0, aVenir: 0, annul: 0, annulTard: 0, annulMontant: 0,
    hzTrajets: 0, hzMontant: 0, trTrajets: 0, trMontant: 0, clientsActifs: {}, chiensServis: {} };
  var j = auj();
  C.seances.forEach(function(s) {
    if (s.presents.length) {
      a.sorties[s.service]++; a.chiens[s.service] += s.presents.length;
      a.clientsActifs[s.client.id] = true;
      s.presents.forEach(function(id) { a.chiensServis[id] = true; });
      if (s.date <= j) a.realise += (+s.montant || 0); else a.aVenir += (+s.montant || 0);
    }
    s.annules.forEach(function(x) { a.annul++; if (x.pct > 0) { a.annulTard++; a.annulMontant += (+x.montant || 0); } });
  });
  C.lignes.forEach(function(l) {
    if (l.type === 'supplement') { a.hzTrajets += l.qte; a.hzMontant += l.total; }
    if (l.type === 'transport') { a.trTrajets += l.qte; a.trMontant += l.total; }
  });
  a.realise = Math.max(0, a.valeur - a.aVenir);   // suppléments et transports comptés avec le réalisé
  a.nbClients = Object.keys(a.clientsActifs).length;
  a.nbChiens = Object.keys(a.chiensServis).length;
  a.totalSorties = a.sorties.walking + a.sorties.daycare + a.sorties.boarding;
  return a;
}

// ── FACTURES ──
function factureValide(f) { return f.statut !== 'annulee' && f.statut !== 'avoir' && f.statut !== 'brouillon'; }
function soldeF(f) {
  var s = ST.suivi[f.id];
  if (s && s.solde != null) return +s.solde || 0;
  return f.statut === 'payee' ? 0 : Math.max(0, (+f.total_ttc || 0) - (+f.montant_paye || 0));
}
function facturesPeriode(debut, fin) {
  var mois = moisEntre(debut, fin);
  return ST.factures.filter(function(f) {
    if (!factureValide(f) || mois.indexOf(f.periode) === -1) return false;
    if (filters.statut === 'payee') return soldeF(f) <= 0;
    if (filters.statut === 'ouverte') return soldeF(f) > 0;
    return true;
  });
}
function somme(l, k) { return l.reduce(function(s, x) { return s + (+(typeof k === 'function' ? k(x) : x[k]) || 0); }, 0); }
function encaisse(debut, fin) { return somme(ST.paiements.filter(function(p) { var d = String(p.date_virement).slice(0, 10); return d >= debut && d <= fin; }), 'montant'); }

// ── CHARGEMENT + RENDU ──
async function loadAllData(force) {
  var b = bornes();
  var n = new Date();
  var debutCharge = [b.prevDebut, debMois(n.getFullYear(), n.getMonth() - 12)].sort()[0];
  var finCharge = [b.fin, n.getFullYear() + '-12-31', finMois(n.getFullYear(), n.getMonth() + 12)].sort()[2];   // v2.58 : projections à 12 mois
  try {
    if (force || !ST || ST.debut > debutCharge || ST.fin < finCharge) {
      document.getElementById('stats-content').innerHTML = '<div class="loading">Chargement des statistiques…</div>';
      ST = await chargerDonnees(debutCharge, finCharge);
      remplirRangers();
    }
    renderStats();
    var upd = document.getElementById('last-update');
    if (upd) upd.textContent = 'Mis à jour ' + new Date().toLocaleTimeString('fr-LU', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    console.error('Erreur stats:', e);
    document.getElementById('stats-content').innerHTML = '<div class="empty">Erreur de chargement — ' + esc(e.message || e) + '</div>';
  }
}

function remplirRangers() {
  var sel = document.getElementById('f-ranger');
  if (!sel) return;
  var v = sel.value;
  sel.innerHTML = '<option value="">Tous</option>' + (ST.staff || []).filter(function(s) { return s.actif !== false; }).map(function(s) {
    return '<option value="' + s.id + '">' + esc(s.prenom + ' ' + (s.nom || '')) + '</option>';
  }).join('') + '<option value="__aucun">Non attribué</option>';
  sel.value = v;
}

function renderStats() {
  Object.keys(CHARTS).forEach(function(k) { try { CHARTS[k].destroy(); } catch (e) {} });
  CHARTS = {};
  var b = bornes();
  var C = calc(b.debut, b.fin), P = calc(b.prevDebut, b.prevFin);
  var A = agreger(C), AP = agreger(P);
  var filtreTxt = [filters.service ? SVC_NOMS[filters.service] : '', filters.ranger ? (document.getElementById('f-ranger').selectedOptions[0] || {}).textContent : ''].filter(Boolean).join(' · ');
  document.getElementById('f-resume').textContent = dateFr(b.debut, true) + ' → ' + dateFr(b.fin, true) + (filtreTxt ? ' · ' + filtreTxt : '');

  // Évolution : 12 derniers mois + prévision jusqu'à décembre
  var n = new Date(), evo = [];
  for (var k = -11; k <= 11 - n.getMonth(); k++) evo.push(perDe(n.getFullYear(), n.getMonth() + k));
  var idxCourant = 11;
  var EV = evo.map(function(per) { var bm = FR_FACT.periodeMois(per); var c = calc(bm.debut, bm.fin); return { per: per, debut: bm.debut, fin: bm.fin, c: c, a: agreger(c) }; });

  var h = '';
  h += sectionVueRapide();   // v2.90
  h += sectionFinance(b, A, AP, EV, idxCourant);
  h += sectionProjection();
  h += sectionServices(b, C, A, AP, EV, idxCourant);
  h += sectionAffluence(b, C, EV);
  h += sectionClients(b, A, AP, EV, idxCourant);
  h += sectionEquipe(b);
  h += sectionCamionnettes(b, EV, idxCourant);
  h += sectionTesteurs();
  document.getElementById('stats-content').innerHTML = h;
  dessiner(b, C, A, EV, idxCourant);
  majProj();
}

// ── COMPTES TEST (v2.71) : phase de test, jamais mélangés aux chiffres ──
function sectionTesteurs() {
  // v2.90 : plus de détail par testeur. Par mois depuis septembre : facturé
  // aux clients actifs, valeur des comptes test, combiné. Mois en cours :
  // estimation d'après le planning.
  var L = testeursSuivis();
  if (!L.length) return '';
  var n = new Date(), p0 = perDe(n.getFullYear(), n.getMonth()), R = [];
  for (var p = TEST_DEBUT; p <= p0; p = perSuivant(p)) {
    var cli = p === p0 ? valeurMois(p).total : somme(facturesMois(p), 'total_ttc');
    R.push({ per: p, cli: cli, tst: testeursMois(p), enCours: p === p0 });
  }
  window._TEST_ROWS = R;
  if (!R.length) return '';
  var tc = somme(R, 'cli'), tt = somme(R, 'tst');
  var rows = R.map(function(r) {
    return '<tr><td>' + esc(moisNom(r.per).charAt(0).toUpperCase() + moisNom(r.per).slice(1)) + (r.enCours ? ' <span class="badge b-muted">en cours</span>' : '') + '</td>'
      + '<td class="num">' + eur(r.cli) + '</td><td class="num">' + eur(r.tst) + '</td><td class="num main">' + eur(r.cli + r.tst) + '</td></tr>';
  }).join('');
  var depuis = moisLong(TEST_DEBUT);
  var h = '<div class="section-title">Comptes test — phase de test</div>';
  h += carte('Facturé par mois — clients et testeurs',
    '<div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>Mois</th><th class="num">Clients actifs</th><th class="num">Testeurs</th><th class="num">Combiné</th></tr></thead><tbody>' + rows + '</tbody></table></div>',
    '<span class="badge b-muted">depuis ' + esc(depuis) + '</span>');
  h += '<div style="margin-top:10px;">' + carte('Clients actifs et testeurs par mois', '<div class="chart-box small"><canvas id="ch-test"></canvas></div><div class="card-note">Au-dessus de chaque barre : le combiné. Survol : clients et testeurs séparément. Mois en cours : estimation d\'après le planning.</div>') + '</div>';
  h += '<div class="grid grid-3" style="margin-top:10px;">'
    + kpi('green', 'Clients actifs · depuis ' + esc(depuis), eur(tc), 'Facturé' + (R[R.length - 1].enCours ? ' (mois en cours estimé)' : ''))
    + kpi('amber', 'Testeurs · depuis ' + esc(depuis), eur(tt), L.map(function(c) { return esc(c.prenom); }).join(', ') + ' · factures de test, sinon planning')
    + kpi('accent', 'Combiné', eur(tc + tt), 'Clients actifs + testeurs')
    + '</div>';
  h += '<div class="card-note" style="margin-top:8px;">Les testeurs ne comptent dans aucun autre chiffre de la page : ils n\'apparaissent qu\'ici et dans la dernière case de la vue rapide.</div>';
  return h;
}

// ── HTML : aides ──
function esc(x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function(ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); }
function fmt(n) { return Math.round(n || 0).toLocaleString('fr-LU'); }
function eur(n) { return fmt(n) + ' €'; }
function kpi(color, label, val, sub, extra) {
  return '<div class="kpi ' + color + '"><div class="kpi-label">' + label + '</div><div class="kpi-val">' + val + '</div>'
    + '<div class="kpi-sub">' + (sub || '') + '</div>' + (extra || '') + '</div>';
}
function delta(cur, prev, label) {
  if (!prev) return cur ? '<span class="kpi-delta neutral">nouveau vs ' + label + '</span>' : '';
  var d = Math.round((cur - prev) / prev * 100);
  var c = d > 0 ? 'up' : d < 0 ? 'down' : 'neutral';
  return '<span class="kpi-delta ' + c + '">' + (d > 0 ? '▲ +' : d < 0 ? '▼ ' : '= ') + d + ' % vs ' + label + '</span>';
}
function barRow(label, val, pct, color) {
  return '<div class="bar-row"><div class="bar-label">' + label + '</div>'
    + '<div class="bar-track"><div class="bar-fill" style="width:' + Math.min(Math.max(pct, 0), 100) + '%;background:' + color + ';"></div></div>'
    + '<div class="bar-val" style="color:' + color + ';">' + val + '</div></div>';
}
function carte(titre, corps, droite) {
  return '<div class="card"><div class="card-head"><span class="card-title">' + titre + '</span>' + (droite || '') + '</div><div class="card-body">' + corps + '</div></div>';
}

// ── SECTION FINANCES ──
function sectionFinance(b, A, AP, EV, ic) {
  var F = facturesPeriode(b.debut, b.fin), FP = facturesPeriode(b.prevDebut, b.prevFin);
  var fac = somme(F, 'total_ttc'), facP = somme(FP, 'total_ttc');
  var enc = encaisse(b.debut, b.fin), encP = encaisse(b.prevDebut, b.prevFin);
  var ouvertes = ST.factures.filter(function(f) { return factureValide(f) && soldeF(f) > 0; });
  var du = somme(ouvertes, soldeF);
  var h = '<div class="section-title">Finances — ' + esc(b.label) + '</div><div class="grid grid-4">';
  var moisP = moisEntre(b.debut, b.fin);

  return h;
}

// ── v2.90 : VUE RAPIDE, SAISONNALITÉ D'APRÈS LES FACTURES, COMPTES TEST ──
var TOUS = { service: '', ranger: '' };          // ces blocs ignorent les filtres Service / Employé
var TEST_DEBUT = '2026-09';                      // comptes test suivis à partir de septembre (Gabriel, 17/10/2026)
function moisNom(per) { return MOIS_L[+String(per).split('-')[1] - 1]; }
function moisLong(per) { return moisNom(per) + ' ' + String(per).split('-')[0]; }
function perSuivant(per) { var p = String(per).split('-'); return perDe(+p[0], +p[1]); }
function facturesMois(per) { return ST.factures.filter(function(f) { return factureValide(f) && f.periode === per; }); }
function valeurMois(per) { var bm = FR_FACT.periodeMois(per); return calc(bm.debut, bm.fin, TOUS); }
// Testeurs suivis : comptes test sous 9000 (le compte personnel de Gabriel, 9004, n'est pas un testeur)
function testeursSuivis() { var T = ST.testeurs; return T ? T.clients.filter(function(c) { return (+c.numero_client || 0) < 9000; }) : []; }
// Comptes test d'un mois : leurs factures de test s'il y en a, sinon la valeur d'après leurs réservations
function testeursMois(per) {
  var T = ST.testeurs, L = testeursSuivis();
  if (!L.length) return 0;
  var bm = FR_FACT.periodeMois(per), tot = 0;
  L.forEach(function(c) {
    var fx = T.factures.filter(function(f) { return f.client_id === c.id && f.periode === per && factureValide(f); });
    if (fx.length) { tot += somme(fx, 'total_ttc'); return; }
    var rs = T.resas.filter(function(r) {
      return r.client_id === c.id && String(r.date_debut).slice(0, 10) <= bm.fin
        && String(r.date_fin_recurrence || r.date_fin || r.date_debut).slice(0, 10) >= bm.debut;
    });
    if (!rs.length) return;
    var an = T.annulations.filter(function(a) { return rs.some(function(r) { return r.id === a.reservation_id; }); });
    var res = FR_FACT.calculer({ client: c, chiens: T.chiens.filter(function(d) { return d.client_id === c.id; }), reservations: rs, annulations: an }, bm.debut, bm.fin, {});
    tot += +res.total_ttc || 0;
  });

}
// Chiens d'un mois d'après le détail des factures (mois sans planning). null si aucun détail.
function chiensFactures(per) {
  var r = { walking: 0, daycare: 0, boarding: 0 }, vu = false;
  facturesMois(per).forEach(function(f) {
    (Array.isArray(f.lignes) ? f.lignes : []).forEach(function(l) {
      if (!l || r[l.service] == null) return;
      if (l.type === 'annulation' || l.type === 'regularisation' || /annulation/i.test(l.label || '')) return;
      var n = +l.qte || 0;

      r[l.service] += n; vu = true;

  return vu ? r : null;
}

// ── FACTURÉ PAR SERVICE (v2.89) ──
// D'après le détail figé des factures (lignes), donc aussi pour les mois
// d'avant l'app, sans réservations. Montants TTC. Chien supplémentaire et
// annulations comptent avec leur service ; une facture sans détail est
// rangée dans « Non détaillé ».
var FAC_SVC = [
  ['walking', 'Dog Walking', '--green'], ['daycare', 'Day Care', '--accent'], ['boarding', 'Boarding', '--blue'],
  ['frais_deplacement', 'Déplacements', '--amber'], ['education', 'Éducation canine', '--blue'],
  ['produits', 'Nourriture et produits', '--text-dim'], ['regularisation', 'Régularisations', '--text-dim'],
  ['autre', 'Autre', '--text-dim'], ['non_detaille', 'Non détaillé', '--text-faint']
];
function factureParService(F, note) {
  var t = {}, total = 0;
  F.forEach(function(f) {
    var tot = +f.total_ttc || 0, vu = 0;
    total += tot;
    (Array.isArray(f.lignes) ? f.lignes : []).forEach(function(l) {
      if (!l) return;
      var k = l.type === 'regularisation' ? 'regularisation' : (l.service || 'autre');
      if (!FAC_SVC.some(function(s) { return s[0] === k; })) k = 'autre';
      t[k] = (t[k] || 0) + (+l.total || 0); vu += (+l.total || 0);
    });
    if (Math.abs(tot - vu) >= 0.01) t.non_detaille = (t.non_detaille || 0) + (tot - vu);
  });
  if (!total) return '<div class="empty">Aucune facture sur la période</div>';
  var h = FAC_SVC.filter(function(s) { return Math.abs(t[s[0]] || 0) >= 0.5; }).map(function(s) {
    var v = t[s[0]], c = 'var(' + s[2] + ')';
    return barRow(s[1], eur(v) + ' · ' + Math.round(v / total * 100) + ' %', v / total * 100, c);
  }).join('');
  return '<div class="fac-svc">' + h + '</div><div class="card-note">' + (note || 'D\'après le détail des factures, TTC — y compris les mois facturés avant l\'app. Chien supplémentaire et annulations sont comptés avec leur service.') + '</div>';
}

// ── SECTION PROJECTIONS (v2.58) ──
// Estimation à 3, 6 et 12 mois = ce qui est déjà réservé (réservations
// récurrentes comprises) + la tendance : chaque mois, (nouveaux clients −
// départs) × CA moyen par client. Hypothèses calculées sur les 6 derniers
// mois complets, modifiables à la main. Tous services, montants TTC.
var PROJ_TOUS = { service: '', ranger: '' };
function projMois(k) { var n = new Date(); var per = perDe(n.getFullYear(), n.getMonth() + k); var bm = FR_FACT.periodeMois(per); return { per: per, debut: bm.debut, fin: bm.fin }; }
function projHistorique() {
  if (ST.cache.__projHist) return ST.cache.__projHist;
  var hist = [];
  for (var k = -6; k <= -1; k++) { var m = projMois(k); m.a = agreger(calc(m.debut, m.fin, PROJ_TOUS)); hist.push(m); }
  var avec = hist.filter(function(m) { return m.a.nbClients > 0; });
  var der3 = hist.slice(-3);
  var base = somme(der3, function(m) { return m.a.valeur; }) / 3;
  var panier = avec.length ? somme(avec, function(m) { return m.a.valeur / m.a.nbClients; }) / avec.length : 0;
  // Nouveaux : clients arrivés sur les 6 derniers mois
  var d0 = hist[0].debut, d1 = hist[5].fin;
  var nouveaux = ST.clients.filter(function(c) { var d = String(c.client_depuis || c.date_inscription || c.created_at || '').slice(0, 10); return d >= d0 && d <= d1; });
  // Départs : servis sur la période, plus rien depuis 2 mois (ni ce mois-ci, ni réservé dans les 3 prochains)
  var actifs = {}; hist.forEach(function(m) { Object.keys(m.a.clientsActifs).forEach(function(id) { actifs[id] = true; }); });
  var recents = {};
  [hist[4], hist[5]].concat([0, 1, 2, 3].map(projMois)).forEach(function(m) {
    var c = m.a ? m.a : agreger(calc(m.debut, m.fin, PROJ_TOUS));
    Object.keys(c.clientsActifs).forEach(function(id) { recents[id] = true; });
  });
  var partis = Object.keys(actifs).filter(function(id) { return !recents[id]; });
  var nbMoisDonnees = Math.max(1, avec.length);
  ST.cache.__projHist = { hist: hist, base: base, panier: panier,
    nouveaux: nouveaux.length / 6, departs: partis.length / nbMoisDonnees,
    nbNouveaux: nouveaux.length, nbPartis: partis.length, clientsActuels: hist[5].a.nbClients };
  return ST.cache.__projHist;
}
function sectionProjection() {
  var H = projHistorique();
  function champ(id, label, val, unite, aide) {
    return '<label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-dim);">' + label
      + '<span style="display:flex;align-items:center;gap:6px;"><input type="number" step="0.5" min="0" id="' + id + '" class="filter-input" value="' + (Math.round(val * 10) / 10) + '" oninput="majProj()" style="width:110px;">'
      + '<span style="color:var(--text-faint);">' + unite + '</span></span>'
      + '<span style="font-size:10.5px;color:var(--text-faint);">' + aide + '</span></label>';
  }
  var h = '<div class="section-title">Projections — 3 mois, 6 mois, 1 an</div>';
  h += carte('Hypothèses de tendance',
    '<div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;">'
    + champ('proj-nouveaux', 'Nouveaux clients par mois', H.nouveaux, 'clients', 'Calculé : ' + H.nbNouveaux + ' sur les 6 derniers mois')
    + champ('proj-panier', 'CA moyen par client et par mois', H.panier, '€ TTC', 'Calculé : moyenne des 6 derniers mois')
    + champ('proj-departs', 'Départs par mois', H.departs, 'clients', 'Calculé : ' + H.nbPartis + ' client' + (H.nbPartis > 1 ? 's' : '') + ' sans séance depuis 2 mois')
    + '<button class="filter-select" style="cursor:pointer;align-self:center;" onclick="resetProj()">Valeurs calculées</button>'
    + '</div>'
    + '<div class="card-note">Base de départ : ' + eur(H.base) + ' par mois (moyenne des 3 derniers mois complets, ' + H.clientsActuels + ' clients servis le mois dernier). Modifiez les hypothèses pour tester un scénario, par ex. 2 nouveaux clients par mois à 350 €.</div>');
  h += '<div id="proj-res" style="margin-top:10px;"></div>';
  return h;
}
function resetProj() {
  var H = projHistorique();
  document.getElementById('proj-nouveaux').value = Math.round(H.nouveaux * 10) / 10;
  document.getElementById('proj-panier').value = Math.round(H.panier * 10) / 10;
  document.getElementById('proj-departs').value = Math.round(H.departs * 10) / 10;
  majProj();
}
function majProj() {
  var zone = document.getElementById('proj-res');
  if (!zone || !ST) return;
  var H = projHistorique();
  var lire = function(id, def) { var v = parseFloat(String((document.getElementById(id) || {}).value || '').replace(',', '.')); return isNaN(v) ? def : Math.max(0, v); };
  var nv = lire('proj-nouveaux', H.nouveaux), panier = lire('proj-panier', H.panier), dep = lire('proj-departs', H.departs);
  var net = nv - dep;
  var mois = [];
  for (var k = 1; k <= 12; k++) {
    var m = projMois(k);
    m.reserve = calc(m.debut, m.fin, PROJ_TOUS).total;
    m.estime = Math.max(m.reserve, Math.max(m.reserve, H.base) + net * k * panier);
    m.clients = Math.max(0, Math.round(H.clientsActuels + net * k));
    mois.push(m);
  }
  function horizon(n, couleur) {
    var l = mois.slice(0, n), fin = l[n - 1];
    var cumE = somme(l, 'estime'), cumR = somme(l, 'reserve');
    var titre = n === 12 ? 'Dans 1 an' : 'Dans ' + n + ' mois';
    return kpi(couleur, titre + ' — ' + MOIS_L[+fin.per.slice(5, 7) - 1] + ' ' + fin.per.slice(0, 4), eur(fin.estime) + '<span style="font-size:13px;color:var(--text-faint);"> /mois</span>',
      'Cumul ' + n + ' mois : <b>' + eur(cumE) + '</b> estimés, dont ' + eur(cumR) + ' déjà réservés · ~' + fin.clients + ' clients');
  }
  zone.innerHTML = '<div class="grid grid-3">' + horizon(3, 'green') + horizon(6, 'accent') + horizon(12, 'blue') + '</div>'
    + '<div style="margin-top:10px;">' + carte('Déjà réservé et estimation, mois par mois',
      '<div class="chart-box"><canvas id="ch-proj"></canvas></div>'
      + '<div class="card-note">Barres : réservations déjà enregistrées (récurrentes comprises). Ligne : estimation = le plus élevé entre le réservé et la base de ' + eur(H.base) + '/mois, plus ' + (Math.round(net * 10) / 10).toString().replace('.', ',') + ' client' + (Math.abs(net) > 1 ? 's' : '') + ' net' + (Math.abs(net) > 1 ? 's' : '') + ' par mois × ' + eur(panier) + '. '
      + 'Ne tient pas compte de la saisonnalité (hiver, vacances) ni des hausses de tarifs : c\'est une tendance, pas une garantie.</div>') + '</div>';
  if (CHARTS['ch-proj']) { try { CHARTS['ch-proj'].destroy(); } catch (e) {} delete CHARTS['ch-proj']; }
  var acc = couleur('--accent', '#ff5f1f'), bl = couleur('--blue', '#5a9ae0');
  nouveauGraph('ch-proj', { data: { labels: mois.map(function(m) { return moisCourt(m.per); }), datasets: [
    { type: 'bar', label: 'Déjà réservé', data: mois.map(function(m) { return Math.round(m.reserve); }), backgroundColor: rgba(bl, 0.55), borderRadius: 4, maxBarThickness: 26 },
    { type: 'line', label: 'Estimation', data: mois.map(function(m) { return Math.round(m.estime); }), borderColor: acc, backgroundColor: acc, pointRadius: 3, borderWidth: 2, tension: 0.25, cubicInterpolationMode: 'monotone' }
  ] }, options: optsBase(false, ' €') });
}

    oT.plugins.tooltip.callbacks.footer = function(items) { var t = 0; items.forEach(function(it) { t += it.parsed.y; }); return 'Combiné : ' + eur(t); };
    var txtCol = couleur('--text', '#333');
    nouveauGraph('ch-test', { type: 'bar', data: { labels: R.map(function(r) { return moisCourt(r.per) + (r.enCours ? ' *' : ''); }), datasets: [
      { label: 'Clients actifs', data: R.map(function(r) { return Math.round(r.cli); }), backgroundColor: gr, borderRadius: 3, maxBarThickness: 40 },
      { label: 'Testeurs', data: R.map(function(r) { return Math.round(r.tst); }), backgroundColor: am, borderRadius: 3, maxBarThickness: 40 }
    ] }, options: oT, plugins: [{ id: 'frTotaux', afterDatasetsDraw: function(ch) {
      var c = ch.ctx; c.save(); c.fillStyle = txtCol; c.font = '700 11px Instrument Sans, Arial, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'bottom';
      ch.data.labels.forEach(function(_, i) {
        var tot = 0, y = null, x = null;
        ch.data.datasets.forEach(function(d, k) {
          if (!ch.isDatasetVisible(k)) return;
          var el = ch.getDatasetMeta(k).data[i]; if (!el) return;
          tot += +d.data[i] || 0; x = el.x; y = y == null ? el.y : Math.min(y, el.y);
        });
        if (x != null && tot) c.fillText(eur(tot), x, y - 4);
      });
      c.restore();
    } }] });
  }

  // Clients servis par mois
  nouveauGraph('ch-cli', { type: 'line', data: { labels: labels, datasets: [
    { label: 'Clients servis', data: EV.map(function(e) { return e.a.nbClients; }), borderColor: gr, backgroundColor: rgba(gr, 0.15), fill: true, pointRadius: 3, borderWidth: 2, tension: 0.25, cubicInterpolationMode: 'monotone', segment: pointille },
    { label: 'Chiens servis', data: EV.map(function(e) { return e.a.nbChiens; }), borderColor: acc, backgroundColor: acc, pointRadius: 2, borderWidth: 2, tension: 0.25, cubicInterpolationMode: 'monotone', segment: pointille }
  ] }, options: optsBase(false) });

  // Km par camionnette (12 derniers mois, pas de prévision)
  var passes = EV.slice(0, ic + 1);
  var pal = [acc, bl, gr, am];
  nouveauGraph('ch-km', { type: 'bar', data: { labels: passes.map(function(e) { return moisCourt(e.per); }), datasets: (ST.camionnettes || []).map(function(v, i) {
    return { label: v.nom, data: passes.map(function(e) { return Math.round(somme(ST.km.filter(function(k) { var d = String(k.date).slice(0, 10); return k.camionnette_id === v.id && d >= e.debut && d <= e.fin; }), kmLigne)); }), backgroundColor: pal[i % pal.length], borderRadius: 3, maxBarThickness: 22 };
  }) }, options: optsBase(false, ' km') });
}

// ── FILTRES ──
function applyFilters() {
  filters.periode = document.getElementById('f-periode').value;
  filters.service = document.getElementById('f-service').value;
  filters.statut  = document.getElementById('f-statut').value;
  filters.ranger  = document.getElementById('f-ranger').value;
  var cu = document.getElementById('f-custom');
  if (cu) cu.style.display = filters.periode === 'custom' ? 'inline-flex' : 'none';
  if (filters.periode === 'custom') {
    var du = document.getElementById('f-du'), au = document.getElementById('f-au');
    var b0 = new Date();
    if (!du.value) du.value = debMois(b0.getFullYear(), b0.getMonth());
    if (!au.value) au.value = finMois(b0.getFullYear(), b0.getMonth());
    filters.du = du.value; filters.au = au.value;
  }
  HEAT_SVC = null;
  loadAllData();
}

function resetFilters() {
  ['f-service', 'f-statut', 'f-ranger'].forEach(function(id) { document.getElementById(id).value = ''; });
  document.getElementById('f-periode').value = 'mois';
  document.getElementById('f-du').value = ''; document.getElementById('f-au').value = '';
  applyFilters();
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', function() {
  loadAllData();
  setInterval(function() { loadAllData(true); }, 5 * 60 * 1000);
});
// Changement de thème depuis l'admin : on redessine avec les nouvelles couleurs
window.addEventListener('message', function(ev) {
  if (ev && ev.data && ev.data.fr === 'theme' && ST) setTimeout(renderStats, 60);
});
</script>

<script>
// Thème envoyé par l'admin (page affichée en cadre) — v40
window.addEventListener('message', function(ev) {
  if (!ev || !ev.data || ev.data.fr !== 'theme') return;
  document.documentElement.classList.toggle('light', !!ev.data.clair);
  try { localStorage.setItem('fr-theme', ev.data.clair ? 'light' : 'dark'); } catch (e) {}
  if (typeof majBoutonTheme === 'function') { try { majBoutonTheme(); } catch (e) {} }
  if (typeof initTheme === 'function') { try { initTheme(); } catch (e) {} }
});
</script>
