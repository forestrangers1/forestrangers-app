<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Rangers — Statistiques</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/norwester">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1c1f14; --surface: #252a1a; --surface2: #2f3520; --surface3: #3d4429;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #eceee6; --text-dim: rgba(236,238,230,0.5); --text-faint: rgba(236,238,230,0.28);
  --accent: #ff5f1f; --accent-dim: rgba(255,95,31,0.12); --accent-mid: rgba(255,95,31,0.25);
  --green: #5ec97a; --green-dim: rgba(94,201,122,0.12);
  --red: #e05a5a; --red-dim: rgba(224,90,90,0.12);
  --blue: #5a9ae0; --blue-dim: rgba(90,154,224,0.12);
  --amber: #f0b429; --amber-dim: rgba(240,180,41,0.12);
  --radius: 10px; --radius-lg: 14px;
}
html, body { min-height: 100vh; font-family: 'Instrument Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

/* ── HEADER ── */
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.back-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
  color: var(--text-dim); font-size: 12px; font-weight: 600;
  text-decoration: none; transition: all 0.15s;
}
.back-btn:hover { color: var(--text); border-color: var(--border2); }
.page-title { font-family: 'Norwester', sans-serif; font-size: 18px; font-weight: 800; }

/* ── FILTRES ── */
.filters-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  position: sticky; top: 56px; z-index: 99;
}
.filter-select {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; color: var(--text);
  font-family: 'Instrument Sans', sans-serif; font-size: 12px;
  cursor: pointer; outline: none; transition: border-color 0.15s;
}
.filter-select:focus { border-color: var(--accent); }
.filter-label { font-size: 11px; color: var(--text-faint); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
.filter-sep { width: 1px; height: 20px; background: var(--border2); margin: 0 4px; }
.btn-reset { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; color: var(--text-dim); font-family: 'Norwester', sans-serif; font-size: 11px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; }
.btn-reset:hover { border-color: var(--accent); color: var(--accent); }

/* ── LAYOUT ── */
.content { padding: 20px 24px 40px; max-width: 1200px; }
.section-title { font-family: 'Norwester', sans-serif; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-faint); margin-bottom: 10px; margin-top: 24px; display: flex; align-items: center; gap: 8px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.grid { display: grid; gap: 10px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } .filters-bar { padding: 10px 14px; } .content { padding: 14px 14px 80px; } }

/* ── KPI CARDS ── */
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px;
  position: relative; overflow: hidden;
}
.kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
.kpi.green::before { background: var(--green); }
.kpi.accent::before { background: var(--accent); }
.kpi.blue::before { background: var(--blue); }
.kpi.red::before { background: var(--red); }
.kpi.amber::before { background: var(--amber); }
.kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
.kpi-val { font-family: 'Norwester', sans-serif; font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
.kpi-sub { font-size: 11px; color: var(--text-faint); }
.kpi.green .kpi-val { color: var(--green); }
.kpi.accent .kpi-val { color: var(--accent); }
.kpi.blue .kpi-val { color: var(--blue); }
.kpi.red .kpi-val { color: var(--red); }
.kpi.amber .kpi-val { color: var(--amber); }
.kpi-delta { font-size: 11px; font-weight: 700; margin-top: 6px; padding: 3px 8px; border-radius: 20px; display: inline-block; }
.kpi-delta.up { background: var(--green-dim); color: var(--green); }
.kpi-delta.down { background: var(--red-dim); color: var(--red); }
.kpi-delta.neutral { background: var(--surface2); color: var(--text-dim); }

/* ── CARDS ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-family: 'Norwester', sans-serif; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); }
.card-body { padding: 14px 16px; }

/* ── BARRES ── */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-label { font-size: 12px; color: var(--text-dim); width: 90px; flex-shrink: 0; text-align: right; }
.bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.bar-val { font-size: 12px; font-weight: 700; width: 60px; text-align: right; flex-shrink: 0; }

/* ── TABLE ── */
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { font-family: 'Norwester', sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-faint); padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 700; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: var(--surface2); }
.tbl td.main { color: var(--text); font-weight: 500; }
.badge { font-family: 'Norwester', sans-serif; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.08em; display: inline-block; }
.b-green  { background: var(--green-dim);  color: var(--green); border: 1px solid rgba(94,201,122,0.25); }
.b-red    { background: var(--red-dim);    color: var(--red);   border: 1px solid rgba(224,90,90,0.25); }
.b-accent { background: var(--accent-dim); color: var(--accent);border: 1px solid var(--accent-mid); }
.b-blue   { background: var(--blue-dim);   color: var(--blue);  border: 1px solid rgba(90,154,224,0.25); }
.b-amber  { background: var(--amber-dim);  color: var(--amber); border: 1px solid rgba(240,180,41,0.25); }
.b-muted  { background: var(--surface2);   color: var(--text-dim); border: 1px solid var(--border2); }

/* ── EMPTY STATE ── */
.empty { padding: 32px; text-align: center; color: var(--text-faint); font-size: 13px; }
.loading { padding: 20px; text-align: center; color: var(--text-faint); font-size: 13px; }

/* ── COMPARAISON ── */
.cmp-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.cmp-row:last-child { border-bottom: none; }
.cmp-label { color: var(--text-dim); }
.cmp-vals { display: flex; gap: 16px; }
.cmp-val { font-weight: 600; }
.cmp-prev { color: var(--text-faint); font-size: 11px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <a href="forestrangers-admin.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Admin
    </a>
    <div class="page-title">📊 Statistiques</div>
  </div>
  <div style="font-size:11px;color:var(--text-faint);" id="last-update">Chargement...</div>
</div>

<!-- FILTRES -->
<div class="filters-bar">
  <span class="filter-label">Période</span>
  <select class="filter-select" id="f-periode" onchange="applyFilters()">
    <option value="mois">Ce mois</option>
    <option value="semaine">Cette semaine</option>
    <option value="trimestre">Ce trimestre</option>
    <option value="annee">Cette année</option>
    <option value="custom">Personnalisé</option>
  </select>
  <input type="month" class="filter-select" id="f-mois" style="display:none;" onchange="applyFilters()">

  <div class="filter-sep"></div>
  <span class="filter-label">Service</span>
  <select class="filter-select" id="f-service" onchange="applyFilters()">
    <option value="">Tous</option>
    <option value="walking">Dog Walking</option>
    <option value="daycare">Day Care</option>
    <option value="boarding">Boarding</option>
  </select>

  <div class="filter-sep"></div>
  <span class="filter-label">Statut</span>
  <select class="filter-select" id="f-statut" onchange="applyFilters()">
    <option value="">Tous</option>
    <option value="payee">Payé</option>
    <option value="impayee">Impayé</option>
  </select>

  <div class="filter-sep"></div>
  <span class="filter-label">Employé</span>
  <select class="filter-select" id="f-ranger" onchange="applyFilters()">
    <option value="">Tous</option>
  </select>

  <div class="filter-sep"></div>
  <button class="btn-reset" onclick="resetFilters()">↺ Reset</button>
</div>

<!-- CONTENU -->
<div class="content" id="stats-content">
  <div class="loading">Chargement des statistiques...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = window.supabase;
const db = createClient('https://zxzhqptimjvdtvvtnpyw.supabase.co', 'sb_publishable_drh_w_i9T4GOZ_AzoqkLcw_SW45X1FT');

// ── ÉTAT GLOBAL ──
var statsData = {
  clients: [], chiens: [], reservations: [], factures: [], promenades: [], staff: []
};
var filters = { periode: 'mois', service: '', statut: '', ranger: '' };

// ── DATES ──
function getPeriodeDates() {
  var now = new Date();
  var debut, fin;
  var p = filters.periode;
  if (p === 'semaine') {
    var dow = now.getDay(); var diff = dow === 0 ? -6 : 1 - dow;
    debut = new Date(now); debut.setDate(now.getDate() + diff); debut.setHours(0,0,0,0);
    fin   = new Date(debut); fin.setDate(debut.getDate() + 6); fin.setHours(23,59,59,999);
  } else if (p === 'mois' || p === 'custom') {
    var moisEl = document.getElementById('f-mois');
    var moisVal = (p === 'custom' && moisEl && moisEl.value) ? moisEl.value : (now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0'));
    var parts = moisVal.split('-');
    debut = new Date(parseInt(parts[0]), parseInt(parts[1])-1, 1);
    fin   = new Date(parseInt(parts[0]), parseInt(parts[1]), 0, 23,59,59,999);
  } else if (p === 'trimestre') {
    var q = Math.floor(now.getMonth() / 3);
    debut = new Date(now.getFullYear(), q*3, 1);
    fin   = new Date(now.getFullYear(), q*3+3, 0, 23,59,59,999);
  } else { // annee
    debut = new Date(now.getFullYear(), 0, 1);
    fin   = new Date(now.getFullYear(), 11, 31, 23,59,59,999);
  }
  return { debut: debut.toISOString().split('T')[0], fin: fin.toISOString().split('T')[0] };
}

function getPeriodePrecedente() {
  var now = new Date();
  var debut, fin;
  var p = filters.periode;
  if (p === 'mois' || p === 'custom') {
    var prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
    debut = prev.toISOString().split('T')[0];
    fin   = new Date(now.getFullYear(), now.getMonth(), 0).toISOString().split('T')[0];
  } else if (p === 'annee') {
    debut = (now.getFullYear()-1) + '-01-01';
    fin   = (now.getFullYear()-1) + '-12-31';
  } else {
    debut = new Date(now.getTime() - 7*24*3600*1000).toISOString().split('T')[0];
    fin   = new Date(now.getTime() - 1).toISOString().split('T')[0];
  }
  return { debut, fin };
}

function getLabelPeriode() {
  var moisFr = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var now = new Date();
  var p = filters.periode;
  if (p === 'mois') return moisFr[now.getMonth()] + ' ' + now.getFullYear();
  if (p === 'semaine') return 'Cette semaine';
  if (p === 'trimestre') return 'T' + (Math.floor(now.getMonth()/3)+1) + ' ' + now.getFullYear();
  if (p === 'annee') return String(now.getFullYear());
  var moisEl = document.getElementById('f-mois');
  if (moisEl && moisEl.value) { var p = moisEl.value.split('-'); return moisFr[parseInt(p[1])-1] + ' ' + p[0]; }
  return 'Personnalisé';
}

// ── CHARGEMENT ──
async function loadAllData() {
  var { debut, fin } = getPeriodeDates();
  var prevPeriode = getPeriodePrecedente();

  try {
    // Tout charger en parallèle
    var [clientsRes, chiensRes, resasRes, facturesRes, staffRes] = await Promise.all([
      db.from('clients').select('*').eq('is_test', false),
      db.from('chiens').select('*, clients(prenom, nom, is_test)').eq('actif', true),
      db.from('reservations').select('*').gte('date_debut', debut).lte('date_debut', fin),
      db.from('factures').select('*, clients!inner(is_test, prenom, nom)').eq('clients.is_test', false),
      db.from('staff').select('prenom, nom').eq('actif', true)
    ]);

    statsData.clients     = clientsRes.data  || [];
    statsData.chiens      = (chiensRes.data  || []).filter(d => !d.clients || !d.clients.is_test);
    statsData.reservations= (resasRes.data   || []).filter(r => {
      if (filters.service && r.service !== filters.service) return false;
      if (filters.ranger  && r.ranger_nom !== filters.ranger) return false;
      return true;
    });
    statsData.factures = (facturesRes.data || []).filter(f => {
      if (filters.statut && f.statut !== filters.statut) return false;
      return true;
    });
    statsData.staff = staffRes.data || [];

    // Factures période précédente
    var prevFactRes = await db.from('factures')
      .select('total_ttc, statut, clients!inner(is_test)')
      .gte('created_at', prevPeriode.debut)
      .lte('created_at', prevPeriode.fin + 'T23:59:59')
      .eq('statut', 'payee')
      .eq('clients.is_test', false);
    statsData.facturesPrev = prevFactRes.data || [];

    // Charger rangers pour filtre
    loadRangerFilter(statsData.staff);

    renderStats();

    var now = new Date();
    var upd = document.getElementById('last-update');
    if (upd) upd.textContent = 'Mis à jour ' + now.toLocaleTimeString('fr-LU', { hour:'2-digit', minute:'2-digit' });

  } catch(e) {
    console.error('Erreur stats:', e);
    document.getElementById('stats-content').innerHTML = '<div class="empty">Erreur de chargement — ' + (e.message || '') + '</div>';
  }
}

function loadRangerFilter(staff) {
  var sel = document.getElementById('f-ranger');
  if (!sel || sel.options.length > 2) return;
  staff.forEach(function(s) {
    var opt = document.createElement('option');
    opt.value = s.prenom;
    opt.textContent = s.prenom + ' ' + s.nom;
    sel.appendChild(opt);
  });
}

// ── RENDU PRINCIPAL ──
function renderStats() {
  var d = statsData;
  var periode = getLabelPeriode();

  // Calculs
  var resas = d.reservations;
  var facts = d.factures;
  var factsPrev = d.facturesPrev || [];

  var caPeriode   = facts.filter(f => f.statut === 'payee').reduce((s,f) => s + (parseFloat(f.total_ttc)||0), 0);
  var caPrev      = factsPrev.reduce((s,f) => s + (parseFloat(f.total_ttc)||0), 0);
  var montantFact = facts.reduce((s,f) => s + (parseFloat(f.total_ttc)||0), 0);
  var mtPaye      = facts.filter(f => f.statut === 'payee').reduce((s,f) => s + (parseFloat(f.total_ttc)||0), 0);
  var mtImpaye    = facts.filter(f => f.statut === 'impayee').reduce((s,f) => s + (parseFloat(f.total_ttc)||0), 0);
  var nbImpayes   = facts.filter(f => f.statut === 'impayee').length;

  var nbWalking  = resas.filter(r => r.service === 'walking').length;
  var nbDaycare  = resas.filter(r => r.service === 'daycare').length;
  var nbBoarding = resas.filter(r => r.service === 'boarding').length;
  var nbPonctuelles  = resas.filter(r => !r.jours || r.jours.length === 0).length;
  var nbRecurrentes  = resas.filter(r => r.jours && r.jours.length > 0).length;

  var clientsActifs   = d.clients.filter(c => c.actif).length;
  var clientsInactifs = d.clients.filter(c => !c.actif).length;
  var clientsFideles  = d.clients.filter(c => c.client_fidele).length;
  var clientsNew      = d.clients.filter(c => !c.client_fidele).length;
  var clientsMultiChiens = new Set(d.chiens.map(ch => ch.client_id)).size;

  var nbAnnulations = resas.filter(r => r.statut === 'annule').length;

  // Calcul delta CA
  var delta = caPrev > 0 ? Math.round(((caPeriode - caPrev) / caPrev) * 100) : 0;
  var deltaClass = delta > 0 ? 'up' : delta < 0 ? 'down' : 'neutral';
  var deltaLabel = delta > 0 ? '▲ +' + delta + '%' : delta < 0 ? '▼ ' + delta + '%' : '= 0%';

  // Moyenne CA/client
  var moyClient = clientsActifs > 0 ? Math.round(caPeriode / clientsActifs) : 0;

  // Service le plus utilisé
  var svcCounts = { walking: nbWalking, daycare: nbDaycare, boarding: nbBoarding };
  var topSvc = Object.entries(svcCounts).sort((a,b) => b[1]-a[1])[0];
  var svcNames = { walking: 'Dog Walking', daycare: 'Day Care', boarding: 'Boarding' };

  // Clients avec impayés
  var clientsImpayesIds = new Set(facts.filter(f => f.statut === 'impayee').map(f => f.client_id));
  var clientsImpayes = d.clients.filter(c => clientsImpayesIds.has(c.id));

  // Top clients
  var clientCA = {};
  facts.filter(f => f.statut === 'payee').forEach(function(f) {
    if (!clientCA[f.client_id]) clientCA[f.client_id] = { ca: 0, nom: f.clients ? f.clients.prenom + ' ' + f.clients.nom : '—' };
    clientCA[f.client_id].ca += parseFloat(f.total_ttc) || 0;
  });
  var topClients = Object.values(clientCA).sort((a,b) => b.ca - a.ca).slice(0, 5);

  // Rangers
  var rangerMap = {};
  resas.forEach(function(r) {
    var rn = r.ranger_nom || 'Gabriel';
    if (!rangerMap[rn]) rangerMap[rn] = { total: 0, termines: 0 };
    rangerMap[rn].total++;
    if (r.statut === 'termine') rangerMap[rn].termines++;
  });

  // HTML
  var html = '';

  // ── SECTION : FINANCIER ──
  html += '<div class="section-title">💶 Financier — ' + periode + '</div>';
  html += '<div class="grid grid-4">';
  html += kpi('green', 'CA ' + periode, fmt(caPeriode) + ' €', 'Factures payées', '<span class="kpi-delta ' + deltaClass + '">' + deltaLabel + ' vs période préc.</span>');
  html += kpi('accent', 'Montant facturé', fmt(montantFact) + ' €', 'Total émis');
  html += kpi('red', 'Impayés', fmt(mtImpaye) + ' €', nbImpayes + ' facture' + (nbImpayes > 1 ? 's' : ''));
  html += kpi('blue', 'Moy. / client', fmt(moyClient) + ' €', 'Sur clients actifs');
  html += '</div>';

  // Comparaison mois
  html += '<div class="grid grid-2" style="margin-top:10px;">';
  html += '<div class="card"><div class="card-head"><span class="card-title">Comparaison avec période précédente</span></div><div class="card-body">';
  html += cmpRow('CA payé', fmt(caPeriode) + ' €', fmt(caPrev) + ' €');
  html += cmpRow('Factures émises', facts.length, factsPrev.length);
  html += cmpRow('Réservations', resas.length, '—');
  html += '</div></div>';

  html += '<div class="card"><div class="card-head"><span class="card-title">Répartition paiements</span></div><div class="card-body">';
  var totalFact = montantFact || 1;
  html += barRow('Payé', fmt(mtPaye) + ' €', Math.round((mtPaye/totalFact)*100), 'var(--green)');
  html += barRow('Impayé', fmt(mtImpaye) + ' €', Math.round((mtImpaye/totalFact)*100), 'var(--red)');
  html += '</div></div>';
  html += '</div>';

  // ── SECTION : SERVICES ──
  html += '<div class="section-title">🐾 Services — ' + periode + '</div>';
  html += '<div class="grid grid-4">';
  html += kpi('accent', 'Dog Walking', nbWalking, 'Promenades');
  html += kpi('green', 'Day Care', nbDaycare, 'Journées');
  html += kpi('blue', 'Boarding', nbBoarding, 'Séjours');
  html += kpi('amber', 'Annulations', nbAnnulations, 'Ce mois');
  html += '</div>';

  html += '<div class="grid grid-2" style="margin-top:10px;">';
  html += '<div class="card"><div class="card-head"><span class="card-title">Répartition services</span></div><div class="card-body">';
  var totalResas = resas.length || 1;
  html += barRow('Dog Walking', nbWalking, Math.round((nbWalking/totalResas)*100), 'var(--accent)');
  html += barRow('Day Care', nbDaycare, Math.round((nbDaycare/totalResas)*100), 'var(--green)');
  html += barRow('Boarding', nbBoarding, Math.round((nbBoarding/totalResas)*100), 'var(--blue)');
  html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-dim);">Service le plus utilisé : <strong style="color:var(--text);">' + (topSvc ? svcNames[topSvc[0]] : '—') + '</strong></div>';
  html += '</div></div>';

  html += '<div class="card"><div class="card-head"><span class="card-title">Type de réservation</span></div><div class="card-body">';
  html += barRow('Ponctuelles', nbPonctuelles, Math.round((nbPonctuelles/totalResas)*100), 'var(--accent)');
  html += barRow('Récurrentes', nbRecurrentes, Math.round((nbRecurrentes/totalResas)*100), 'var(--blue)');
  html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-dim);">Total réservations : <strong style="color:var(--text);">' + resas.length + '</strong></div>';
  html += '</div></div>';
  html += '</div>';

  // ── SECTION : CLIENTS ──
  html += '<div class="section-title">👥 Clients</div>';
  html += '<div class="grid grid-4">';
  html += kpi('green', 'Clients actifs', clientsActifs, 'Hors testeurs');
  html += kpi('blue', 'Fidèles', clientsFideles, 'Clients réguliers');
  html += kpi('accent', 'Nouveaux', clientsNew, 'Premier service');
  html += kpi('red', 'Avec impayés', clientsImpayesIds.size, 'À relancer');
  html += '</div>';

  html += '<div class="grid grid-2" style="margin-top:10px;">';
  // Top clients
  html += '<div class="card"><div class="card-head"><span class="card-title">Top clients — CA ' + periode + '</span></div>';
  if (topClients.length > 0) {
    html += '<table class="tbl"><thead><tr><th>#</th><th>Client</th><th>CA</th></tr></thead><tbody>';
    topClients.forEach(function(c, i) {
      html += '<tr><td class="main" style="color:var(--accent);font-family:\'Norwester\',sans-serif;">' + String(i+1).padStart(2,'0') + '</td><td class="main">' + c.nom + '</td><td class="main" style="color:var(--green);">' + fmt(c.ca) + ' €</td></tr>';
    });
    html += '</tbody></table>';
  } else { html += '<div class="empty">Aucune donnée</div>'; }
  html += '</div>';

  // Clients avec impayés
  html += '<div class="card"><div class="card-head"><span class="card-title">Clients avec impayés</span><span class="badge b-red">' + clientsImpayesIds.size + '</span></div>';
  if (clientsImpayes.length > 0) {
    html += '<table class="tbl"><thead><tr><th>Client</th><th>Montant</th></tr></thead><tbody>';
    clientsImpayes.forEach(function(c) {
      var mt = facts.filter(f => f.client_id === c.id && f.statut === 'impayee').reduce((s,f) => s + (parseFloat(f.total_ttc)||0), 0);
      html += '<tr><td class="main">' + c.prenom + ' ' + c.nom + '</td><td class="main" style="color:var(--red);">' + fmt(mt) + ' €</td></tr>';
    });
    html += '</tbody></table>';
  } else { html += '<div class="empty" style="color:var(--green);">✓ Aucun impayé</div>'; }
  html += '</div>';
  html += '</div>';

  // ── SECTION : CHIENS ──
  html += '<div class="section-title">🐕 Chiens</div>';
  html += '<div class="grid grid-4">';
  html += kpi('green', 'Chiens actifs', d.chiens.length, 'Enregistrés');
  html += kpi('accent', 'Propriétaires', new Set(d.chiens.map(ch=>ch.client_id)).size, 'Clients avec chiens');
  html += kpi('blue', 'Multi-chiens', d.clients.filter(c => d.chiens.filter(ch=>ch.client_id===c.id).length > 1).length, 'Clients 2+ chiens');
  html += kpi('amber', 'Grands gabarits', d.chiens.filter(ch => ch.poids_kg >= 35).length, '≥ 35 kg');
  html += '</div>';

  // ── SECTION : ÉQUIPE ──
  html += '<div class="section-title">👷 Équipe — ' + periode + '</div>';
  html += '<div class="grid grid-2">';
  html += '<div class="card"><div class="card-head"><span class="card-title">Répartition des missions</span></div><div class="card-body">';
  var rangerEntries = Object.entries(rangerMap);
  if (rangerEntries.length > 0) {
    var maxMissions = Math.max(...rangerEntries.map(e => e[1].total));
    rangerEntries.sort((a,b) => b[1].total - a[1].total).forEach(function(e) {
      var pct = maxMissions > 0 ? Math.round((e[1].total / maxMissions) * 100) : 0;
      html += barRow(e[0], e[1].total + ' missions', pct, 'var(--accent)');
    });
  } else { html += '<div style="color:var(--text-faint);font-size:13px;text-align:center;padding:16px;">Aucune mission cette période</div>'; }
  html += '</div></div>';

  html += '<div class="card"><div class="card-head"><span class="card-title">Taux de complétion</span></div><div class="card-body">';
  rangerEntries.forEach(function(e) {
    var pct = e[1].total > 0 ? Math.round((e[1].termines / e[1].total) * 100) : 0;
    html += barRow(e[0], pct + '% terminé', pct, pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)');
  });
  if (!rangerEntries.length) html += '<div style="color:var(--text-faint);font-size:13px;text-align:center;padding:16px;">Aucune donnée</div>';
  html += '</div></div>';
  html += '</div>';

  document.getElementById('stats-content').innerHTML = html;
}

// ── HELPERS ──
function fmt(n) { return Math.round(n || 0).toLocaleString('fr-LU'); }

function kpi(color, label, val, sub, extra) {
  return '<div class="kpi ' + color + '">'
    + '<div class="kpi-label">' + label + '</div>'
    + '<div class="kpi-val">' + val + '</div>'
    + '<div class="kpi-sub">' + (sub||'') + '</div>'
    + (extra || '')
    + '</div>';
}

function barRow(label, val, pct, color) {
  return '<div class="bar-row">'
    + '<div class="bar-label">' + label + '</div>'
    + '<div class="bar-track"><div class="bar-fill" style="width:' + Math.min(pct,100) + '%;background:' + color + ';"></div></div>'
    + '<div class="bar-val" style="color:' + color + ';">' + val + '</div>'
    + '</div>';
}

function cmpRow(label, current, prev) {
  return '<div class="cmp-row"><span class="cmp-label">' + label + '</span>'
    + '<div class="cmp-vals"><span class="cmp-val">' + current + '</span>'
    + '<span class="cmp-prev">vs ' + prev + '</span></div></div>';
}

// ── FILTRES ──
function applyFilters() {
  filters.periode = document.getElementById('f-periode').value;
  filters.service = document.getElementById('f-service').value;
  filters.statut  = document.getElementById('f-statut').value;
  filters.ranger  = document.getElementById('f-ranger').value;
  var moisEl = document.getElementById('f-mois');
  if (moisEl) moisEl.style.display = filters.periode === 'custom' ? 'block' : 'none';
  loadAllData();
}

function resetFilters() {
  document.getElementById('f-periode').value = 'mois';
  document.getElementById('f-service').value = '';
  document.getElementById('f-statut').value  = '';
  document.getElementById('f-ranger').value  = '';
  filters = { periode: 'mois', service: '', statut: '', ranger: '' };
  loadAllData();
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', function() {
  loadAllData();
  setInterval(loadAllData, 5 * 60 * 1000);
});
</script>
</body>
</html>
