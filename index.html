<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Forest Rangers</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff5f1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forest Rangers">
  <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<script>
// Les liens envoyes par Supabase (reinitialisation, invitation, confirmation)
// arrivent sur la racine du site avec le jeton dans le fragment (#access_token=...)
// ou en parametre (?code=...). Une redirection seche perdrait ce jeton :
// on le transmet donc tel quel a la page concernee.
(function () {
  var hash   = window.location.hash || '';
  var search = window.location.search || '';

  var isRecovery =
    hash.indexOf('type=recovery') !== -1 ||
    search.indexOf('type=recovery') !== -1 ||
    hash.indexOf('access_token=') !== -1 ||
    search.indexOf('code=') !== -1 ||
    search.indexOf('error_description=') !== -1;

  if (isRecovery) {
    window.location.replace('reset-password.html' + search + hash);
  } else {
    window.location.replace('forestrangers-login.html');
  }
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js');
  });
}
</script>
</body>
</html>
