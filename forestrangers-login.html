<title>Forest Rangers — Connexion</title>
<script>
/* Theme partage (cle 'fr-theme') : clair par defaut. Le login est la
   premiere page vue par le client, il doit suivre le meme theme que la
   suite du parcours. */
try { if (localStorage.getItem('fr-theme') !== 'dark') document.documentElement.classList.add('light'); } catch(e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Correctif police : Norwester etait appelee dans font-family sans jamais
     etre chargee. Elle ne s'affichait que sur les machines ou elle est
     installee localement ; partout ailleurs le navigateur retombait sur un
     sans-serif generique. Elle est desormais auto-hebergee (licence SIL OFL,
     voir fonts/OFL-Norwester.txt). Oswald sert de repli condense si le
     fichier est absent. -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Norwester';
  src: url('fonts/norwester.woff2') format('woff2'),
       url('fonts/norwester.woff') format('woff');

  font-style: normal;
  font-display: swap;
}
</style>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/norwester">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Repli CDN : si jsDelivr n'a pas repondu, on tente unpkg avant d'abandonner. -->
<script>if (!window.supabase) { document.write('<scr' + 'ipt src="https://unpkg.com/@supabase/supabase-js@2"><\/scr' + 'ipt>'); }</script>
<script>
  // ── Init resiliente (correctif : "Cannot access 'db' before initialization") ──
  // Le SDK Supabase vient d'un CDN. Sur reseau faible il peut ne pas arriver :
  // window.supabase est alors indefini, l'ancien `const db` restait en zone morte
  // et chaque appel renvoyait une erreur incomprehensible. On declare `db` en `var`
  // (jamais de zone morte) et on affiche un message clair si le SDK manque.
  var SUPABASE_URL = 'https://zxzhqptimjvdtvvtnpyw.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_drh_w_i9T4GOZ_AzoqkLcw_SW45X1FT';
  var db = null;

  function frErreurReseau(detail) {
    if (document.getElementById('fr-offline-overlay')) return;
    var html = '<div id="fr-offline-overlay" style="position:fixed;inset:0;z-index:99999;'
      + 'background:#1c1f14;color:#eceee6;display:flex;align-items:center;justify-content:center;'
      + 'padding:24px;font-family:\'Instrument Sans\',system-ui,sans-serif;text-align:center;">'
      + '<div style="max-width:340px;">'
      + '<div style="font-size:34px;margin-bottom:14px;">📡</div>'
      + '<div style="font-size:17px;font-weight:600;margin-bottom:10px;">Connexion au serveur impossible</div>'
      + '<div style="font-size:13.5px;line-height:1.6;color:rgba(236,238,230,0.6);margin-bottom:20px;">'
      + 'Votre reseau ne permet pas de charger l\'application. Verifiez votre connexion, '
      + 'passez en wifi si possible, puis reessayez.</div>'
      + '<button onclick="location.reload()" style="background:#ff5f1f;color:#fff;border:0;'
      + 'border-radius:10px;padding:13px 26px;font-size:14px;font-weight:600;cursor:pointer;">'
      + 'Reessayer</button>'
      + '<div style="font-size:10.5px;color:rgba(236,238,230,0.25);margin-top:16px;">'
      + (detail || 'SDK Supabase indisponible') + '</div>'
      + '</div></div>';
    function poser() { document.body.insertAdjacentHTML('beforeend', html); }
    if (document.body) poser(); else document.addEventListener('DOMContentLoaded', poser);
  }

  if (window.supabase && window.supabase.createClient) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        storageKey: 'fr-auth',
        storage: window.localStorage,
        // verrou neutralise : evite les erreurs Navigator Lock / DataCloneError sur mobile
        lock: async (_name, _acquireTimeout, fn) => await fn()
      }
    });
  } else {
    frErreurReseau();
  }
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #ff5f1f;
  --bg:     #1c1f14;
  --s1:     #252a1a;
  --s2:     #2f3520;
  --bd:     rgba(255,255,255,0.07);
  --bd2:    rgba(255,255,255,0.13);
  --tx:     #eceee6;
  --td:     rgba(236,238,230,0.55);
  --tf:     rgba(236,238,230,0.28);
  --green:  #5ec97a;
  --r:      12px;
}

/* `html` porte seulement le fond : en faire un conteneur flex reduisait
   `body` a la largeur de son contenu, d'ou les bandes sombres a gauche
   et a droite sur grand ecran. */
html {
  min-height: 100vh;
  background: #1c1f14;
}
body {
  min-height: 100vh;
  width: 100%;
  font-family: 'Instrument Sans', sans-serif;
  background: #1c1f14;
  color: #eceee6;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

@media (max-width: 480px) {
  body {
    align-items: flex-start;
    padding: 0;
  }
  .login-card {
    width: 100% !important;
    max-width: 100% !important;
    min-height: 100vh;
    border-radius: 0 !important;
    padding: 48px 24px 36px !important;
    box-shadow: none !important;
    border: none !important;
  }
}

/* ══════════════════════════════════════════════════════════════
   MODE CLAIR (classe html.light, cle 'fr-theme' partagee)
   ══════════════════════════════════════════════════════════════ */
html.light {
  --bg:  #f4f5f0;
  --s1:  #ffffff;
  --s2:  #eef0e8;
  --bd:  rgba(0,0,0,0.08);
  --bd2: rgba(0,0,0,0.14);
  --tx:  #1c1f14;
  --td:  rgba(28,31,20,0.58);
  --tf:  rgba(28,31,20,0.32);
  --green: #2e7d32;
}
html.light,
html.light body        { background: var(--bg) !important; }
html.light body        { color: var(--tx); }
html.light .version    { color: rgba(28,31,20,0.22); }
/* En dessous de 900px la marque est sur la carte blanche, pas sur le
   panneau sombre : le titre doit passer en texte foncé. */
html.light .brand-name { color: var(--tx); }
html.light .login-card { background: #ffffff; border: 1px solid rgba(0,0,0,0.07);
                         box-shadow: 0 18px 50px rgba(28,31,20,0.10); }
html.light body::before {
  background:
    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(46,125,50,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 20%, rgba(255,95,31,0.07) 0%, transparent 55%);
}
html.light .brand-panel { background: linear-gradient(160deg, #2f3520, #1c1f14); }

/* ── BACKGROUND TEXTURE ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(94,201,122,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 20%, rgba(255,95,31,0.07) 0%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}

/* ── CARD ── */
.login-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  background: #252a1a;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 40px 36px 36px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.5);
}

/* ── LOGO + TITLE ── */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 32px;
}
.brand-logo {
  width: 72px;
  height: 72px;
  object-fit: contain;
  margin-bottom: 14px;
}
.brand-name {
  font-family: 'Norwester', 'Oswald', 'Arial Narrow', sans-serif; font-size: 13px; font-weight: 800;
  color: #eceee6; letter-spacing: 0.03em;
  line-height: 1.8; padding-bottom: 6px; overflow: visible;
  clip: auto; display: inline-block;
}
.brand-sub {
  font-size: 12px;
  color: var(--td);
  margin-top: 4px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ── ROLE SELECTOR ── */
.role-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--tf);
  font-weight: 700;
  margin-bottom: 10px;
  text-align: center;
}
.role-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-bottom: 28px;
  background: var(--bg);
  border-radius: var(--r);
  padding: 5px;
}
.role-tab {
  padding: 10px 6px;
  border-radius: 9px;
  border: none;
  background: transparent;
  color: var(--td);
  font-family: 'Norwester', 'Oswald', 'Arial Narrow', sans-serif;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.18s;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.role-tab svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
}
.role-tab.active {
  background: var(--s2);
  color: #eceee6;
}
.role-tab.active.admin  { color: var(--accent); }
.role-tab.active.staff  { color: var(--green); }
.role-tab.active.client { color: #5a9ae0; }

/* ── FORM ── */
.field { margin-bottom: 14px; }
.field-label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--tf);
  font-weight: 700;
  margin-bottom: 6px;
}
.field-input {
  width: 100%;
  background: #1c1f14;
  border: 1.5px solid var(--bd2);
  border-radius: 10px;
  padding: 12px 14px;
  color: #eceee6;
  font-family: 'Instrument Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border 0.15s;
}
.field-input:focus { border-color: var(--accent); }
.field-input::placeholder { color: var(--tf); }

/* ── PASSWORD WRAPPER ── */
.pw-wrap { position: relative; }
.pw-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--tf);
  padding: 4px;
  transition: color 0.15s;
}
.pw-toggle:hover { color: var(--td); }
.pw-toggle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }

/* ── FORGOT ── */
.forgot {
  display: block;
  text-align: right;
  font-size: 11px;
  color: var(--tf);
  margin-top: -8px;
  margin-bottom: 20px;
  cursor: pointer;
  transition: color 0.15s;
  text-decoration: none;
}
.forgot:hover { color: var(--accent); }

/* ── SUBMIT ── */
.btn-login {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: white;
  font-family: 'Norwester', 'Oswald', 'Arial Narrow', sans-serif;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-login:hover { background: #ff7a3d; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,95,31,0.3); }
.btn-login:active { transform: translateY(0); }
.btn-login.staff  { background: #2e7d32; }
.btn-login.staff:hover  { background: #388e3c; box-shadow: 0 8px 24px rgba(94,201,122,0.25); }
.btn-login.client { background: #1565c0; }
.btn-login.client:hover { background: #1976d2; box-shadow: 0 8px 24px rgba(90,154,224,0.25); }
.btn-login svg { width: 16px; height: 16px; stroke: white; fill: none; }
.btn-login:disabled { background: var(--s2); color: var(--tf); cursor: not-allowed; transform: none; box-shadow: none; }

/* ── ERROR ── */
.error-msg {
  display: none;
  background: rgba(224,90,90,0.12);
  border: 1px solid rgba(224,90,90,0.25);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12px;
  color: #e05a5a;
  margin-bottom: 14px;
  text-align: center;
}

/* ── LOADING ── */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── DIVIDER ── */
.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 24px 0 20px;
  color: var(--tf);
  font-size: 11px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--bd);
}

/* ── FOOTER ── */
.login-footer {
  text-align: center;
  font-size: 11px;
  color: var(--tf);
  margin-top: 24px;
}
.login-footer a { color: var(--accent); text-decoration: none; }
.login-footer a:hover { text-decoration: underline; }

/* ── VERSION ── */
.version {
  position: fixed;
  bottom: 16px;
  right: 16px;
  font-size: 10px;
  color: rgba(236,238,230,0.15);
  z-index: 1;
}

@media (max-width: 480px) {
  .login-card { padding: 32px 24px 28px; border-radius: 20px; }
  .brand-logo { width: 60px; height: 60px; }
}

/* ── MODE JOUR — textes globaux ──
   Ce bloc n'etait scope sur rien : en mode sombre il forcait les champs
   en blanc et les libelles en texte fonce sur carte foncee, donc
   illisibles. Tout est desormais sous `html.light`. */
html.light .toggle-option-title { color: #1c1f14 !important; }
html.light .toggle-option-desc { color: rgba(28,31,20,0.6) !important; }
html.light .toggle-option.selected .toggle-option-title { color: #eceee6 !important; }
html.light .toggle-option.selected .toggle-option-desc { color: rgba(236,238,230,0.7) !important; }

/* Champs input */
html.light .field-input,
html.light .form-input,
html.light select.field-input {
  color: #1c1f14 !important;
  background: #ffffff !important;
  border-color: rgba(0,0,0,0.12) !important;
}
html.light .field-input::placeholder,
html.light .form-input::placeholder { color: rgba(28,31,20,0.35) !important; }

/* Labels */
html.light .field-label,
html.light .form-label,
html.light .section-label {
  color: rgba(28,31,20,0.45) !important;
}

/* Texte général sur fond clair */
html.light .section-title,
html.light .card-title,
html.light .info-title {
  color: #1c1f14 !important;
}

/* Badges sur fond clair restent lisibles */
html.light .badge.b-green { background: rgba(46,125,50,0.12) !important; color: #2e7d32 !important; }
html.light .badge.b-amber { background: rgba(180,100,0,0.12) !important; color: #b45000 !important; }
html.light .badge.b-accent { background: rgba(255,95,31,0.12) !important; color: #c94400 !important; }
html.light .badge.b-blue  { background: rgba(21,101,192,0.12) !important; color: #1565c0 !important; }
html.light .badge.b-red   { background: rgba(198,40,40,0.12) !important; color: #c62828 !important; }

/* ══════════════════════════════════════════════════════════════
   MISE EN PAGE DESKTOP — deux colonnes a partir de 900px
   Marque a gauche, formulaire a droite. En dessous : carte simple.

   CE BLOC DOIT RESTER EN DERNIER. Il etait place plus haut, avant la
   regle de base `.login-card` : a specificite egale, c'est l'ordre du
   fichier qui tranche, donc la regle de base reimposait max-width 420px
   et le padding, tout en laissant passer `display: grid` et
   `grid-template-columns: 340px 1fr`. Resultat sur desktop : la colonne
   marque occupait les 340px disponibles et la colonne formulaire
   debordait de la carte, ou `overflow: hidden` la coupait. L'ecran de
   connexion n'affichait plus que le logo.
   ══════════════════════════════════════════════════════════════ */
@media (min-width: 900px) {
  .login-card {
    max-width: 860px;
    display: grid;
    grid-template-columns: 340px 1fr;
    padding: 0;
    overflow: hidden;
    border-radius: 20px;
  }
  .brand {
    margin-bottom: 0;
    padding: 48px 32px;
    justify-content: center;
    background: linear-gradient(160deg, #2f3520, #1c1f14);
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .brand-logo  { width: 96px; height: 96px; margin-bottom: 20px; }
  .brand-name  { color: #eceee6 !important; }
  .brand-sub   { color: rgba(236,238,230,0.55) !important; }
  .login-form-col { padding: 44px 44px 36px; }
}

</style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff5f1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forest Rangers">

</head>
<body>

<div class="login-card">

  <!-- BRAND -->
  <div class="brand">
    <img class="brand-logo" src="logo-forestrangers.png" alt="Forest Rangers">
    <div class="brand-name">Forest Rangers</div>
    <div class="brand-sub">Luxembourg · ARCANIN S.à r.l.</div>
  </div>

  <div class="login-form-col">

  <!-- ROLE SELECTOR -->
  <div class="role-label">Je me connecte en tant que</div>
  <div class="role-tabs">
    <button class="role-tab admin active" id="tab-admin" onclick="setRole('admin',this)">
      <svg viewBox="0 0 24 24"><path d="M12 2L3 7l9 5 9-5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>
      Admin
    </button>
    <button class="role-tab staff" id="tab-staff" onclick="setRole('staff',this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Ranger
    </button>
    <button class="role-tab client" id="tab-client" onclick="setRole('client',this)">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Client
    </button>
  </div>

  <!-- ERROR -->
  <div class="error-msg" id="error-msg">Email ou mot de passe incorrect.</div>

  <!-- FORM -->
  <div class="field">
    <label class="field-label">Adresse email</label>
    <input type="email" class="field-input" id="email" placeholder="votre@email.com" autocomplete="email" onkeydown="if(event.key==='Enter')login()">
  </div>

  <div class="field">
    <label class="field-label">Mot de passe</label>
    <div class="pw-wrap">
      <input type="password" class="field-input" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()" style="padding-right:44px;">
      <button class="pw-toggle" onclick="togglePw()" type="button">
        <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <a class="forgot" onclick="forgotPassword()">Mot de passe oublié ?</a>

  <button class="btn-login admin" id="btn-login" onclick="login()">
    <span id="btn-text">Se connecter</span>
    <div class="spinner" id="spinner"></div>
    <svg id="btn-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>

  <div class="login-footer">
    Première connexion ? <a onclick="firstLogin()">Contactez Gabriel</a>
  </div>

  </div><!-- /login-form-col -->

</div>

<div class="version">Forest Rangers · v1.0 · 2026</div>

<script>
var currentRole = 'admin';

function setRole(role, btn) {
  currentRole = role;
  document.querySelectorAll('.role-tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');

  var loginBtn = document.getElementById('btn-login');
  loginBtn.className = 'btn-login ' + role;

  var labels = { admin: 'Se connecter', staff: 'Connexion Ranger', client: 'Accéder à mon espace' };
  document.getElementById('btn-text').textContent = labels[role];

  document.getElementById('error-msg').style.display = 'none';
}

function togglePw() {
  var input = document.getElementById('password');
  var icon = document.getElementById('eye-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

async function login() {
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var errorEl = document.getElementById('error-msg');
  var btn = document.getElementById('btn-login');
  var spinner = document.getElementById('spinner');
  var btnText = document.getElementById('btn-text');
  var btnIcon = document.getElementById('btn-icon');

  if (!email || !password) {
    errorEl.textContent = 'Veuillez remplir tous les champs.';
    errorEl.style.display = 'block';
    return;
  }

  if (!db) {
    errorEl.textContent = 'Connexion au serveur indisponible. Verifiez votre reseau et reessayez.';
    errorEl.style.display = 'block';
    frErreurReseau();
    return;
  }

  // Loading state
  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.style.display = 'none';
  btnIcon.style.display = 'none';
  errorEl.style.display = 'none';

  try {
    var res = await db.auth.signInWithPassword({ email: email, password: password });

    if (res.error) throw res.error;

    // Résolution du rôle depuis la table staff (auth_id).
    // staff.role = 'admin' -> admin ; 'caretaker'/'walker' -> staff ; pas de fiche staff -> client.
    var staffRes = await db.from('staff').select('role').eq('auth_id', res.data.user.id).maybeSingle();
    if (staffRes.error) {
      console.error('Lecture staff refusee:', staffRes.error);
      throw { message: 'Impossible de determiner votre profil (' + staffRes.error.message + ').' };
    }
    var role = 'client';
    if (staffRes.data) {
      role = (staffRes.data.role === 'admin') ? 'admin' : 'staff';
    }

    // Redirect based on role
    var redirects = {
      admin:  'forestrangers-admin.html',
      staff:  'forestrangers-staff.html',
      client: 'forestrangers-client.html'
    };

    // Check role matches selected tab
    if (currentRole !== 'client' && role !== currentRole) {
      throw { message: 'Accès non autorisé pour ce profil.' };
    }

    window.location.href = redirects[role] || 'forestrangers-client.html';

  } catch(err) {
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.style.display = 'inline';
    btnIcon.style.display = 'block';
    errorEl.textContent = err.message === 'Invalid login credentials'
      ? 'Email ou mot de passe incorrect.'
      : (err.message || 'Une erreur est survenue.');
    errorEl.style.display = 'block';

    // Shake animation
    var card = document.querySelector('.login-card');
    card.style.animation = 'shake 0.4s ease';
    setTimeout(function() { card.style.animation = ''; }, 400);
  }
}

function forgotPassword() {
  var email = document.getElementById('email').value.trim();
  if (!email) {
    document.getElementById('error-msg').textContent = 'Entrez votre email pour recevoir un lien de réinitialisation.';
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('email').focus();
    return;
  }
  var errorEl = document.getElementById('error-msg');
  if (!db) {
    errorEl.textContent = 'Connexion au serveur indisponible. Verifiez votre reseau et reessayez.';
    errorEl.style.display = 'block';
    frErreurReseau();
    return;
  }
  errorEl.style.background = '';
  errorEl.style.borderColor = '';
  errorEl.style.color = '';
  errorEl.textContent = 'Envoi en cours…';
  errorEl.style.display = 'block';
  db.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset-password.html'
  }).then(function(r) {
    if (r.error) {
      errorEl.style.background = '';
      errorEl.style.borderColor = '';
      errorEl.style.color = '';
      errorEl.textContent = 'Envoi impossible : ' + r.error.message;
    } else {
      errorEl.style.background = 'rgba(94,201,122,0.12)';
      errorEl.style.borderColor = 'rgba(94,201,122,0.25)';
      errorEl.style.color = '#5ec97a';
      errorEl.textContent = 'Email de réinitialisation envoyé à ' + email;
    }
    errorEl.style.display = 'block';
  }).catch(function(e) {
    // Sans ce catch, une promesse rejetee (reseau coupe en cours d'envoi)
    // ne s'affichait nulle part : l'utilisateur restait sur un ecran muet.
    errorEl.style.background = '';
    errorEl.style.borderColor = '';
    errorEl.style.color = '';
    errorEl.textContent = 'Envoi impossible : ' + (e && e.message ? e.message : 'reseau indisponible') + '.';
    errorEl.style.display = 'block';
  });
}

function firstLogin() {
  window.location.href = 'mailto:forestrangerslux@gmail.com?subject=Demande%20de%20connexion%20Forest%20Rangers';
}
