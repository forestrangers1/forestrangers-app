<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Rangers — Nouveau mot de passe</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = window.supabase;
  const SUPABASE_URL = 'https://zxzhqptimjvdtvvtnpyw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_drh_w_i9T4GOZ_AzoqkLcw_SW45X1FT';
  // detectSessionInUrl: true UNIQUEMENT ici — c'est ce qui consomme le jeton
  // de récupération présent dans l'URL. Le storageKey reste 'fr-auth' comme
  // partout ailleurs pour que la session soit reconnue par le reste de la PWA.
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      flowType: 'pkce',
      storageKey: 'fr-auth',
      storage: window.localStorage,
      lock: async (_name, _acquireTimeout, fn) => await fn()
    }
  });
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #ff5f1f;
  --bg:     #1c1f14;
  --s1:     #252a1a;
  --bd:     rgba(255,255,255,0.07);
  --bd2:    rgba(255,255,255,0.13);
  --tx:     #eceee6;
  --td:     rgba(236,238,230,0.55);
  --green:  #5ec97a;
  --r:      12px;
}
html, body {
  min-height: 100vh;
  font-family: 'Instrument Sans', sans-serif;
  background: var(--bg);
  color: var(--tx);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  width: 100%;
  max-width: 400px;
  background: var(--s1);
  border: 1px solid var(--bd);
  border-radius: var(--r);
  padding: 32px 28px;
}
h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.sub { color: var(--td); font-size: 13px; margin-bottom: 24px; line-height: 1.5; }
label { display: block; font-size: 12px; color: var(--td); margin-bottom: 6px; }
input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--bd2);
  border-radius: 8px;
  color: var(--tx);
  font-family: inherit;
  font-size: 14px;
  margin-bottom: 16px;
}
input:focus { outline: none; border-color: var(--accent); }
button {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
button:disabled { opacity: 0.5; cursor: not-allowed; }
.msg {
  display: none;
  padding: 11px 13px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  line-height: 1.45;
  background: rgba(255,95,31,0.12);
  border: 1px solid rgba(255,95,31,0.25);
  color: #ffb08a;
}
.msg.ok {
  background: rgba(94,201,122,0.12);
  border-color: rgba(94,201,122,0.25);
  color: var(--green);
}
.back { display: block; text-align: center; margin-top: 18px; color: var(--td); font-size: 13px; text-decoration: none; }
.back:hover { color: var(--tx); }
</style>
</head>
<body>

<div class="card">
  <h1>Nouveau mot de passe</h1>
  <p class="sub" id="sub">Vérification du lien en cours…</p>

  <div class="msg" id="msg"></div>

  <div id="form" style="display:none;">
    <label for="pw1">Nouveau mot de passe</label>
    <input type="password" id="pw1" autocomplete="new-password" placeholder="8 caractères minimum">

    <label for="pw2">Confirmation</label>
    <input type="password" id="pw2" autocomplete="new-password" placeholder="Retapez le mot de passe">

    <button id="btn" onclick="submitPassword()">Enregistrer</button>
  </div>

  <a class="back" href="forestrangers-login.html">Retour à la connexion</a>
</div>

<script>
function show(text, ok) {
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = ok ? 'msg ok' : 'msg';
  m.style.display = 'block';
}

// Le lien de récupération arrive soit avec un fragment #access_token=…&type=recovery,
// soit avec ?code=… selon le flux configuré. detectSessionInUrl gère les deux,
// mais on laisse un court délai au client pour qu'il finisse l'échange.
(async function init() {
  var sub = document.getElementById('sub');

  var params = new URLSearchParams(window.location.search);
  if (params.get('error_description')) {
    sub.textContent = 'Ce lien n\u2019est plus valide.';
    show(decodeURIComponent(params.get('error_description')) + ' Demandez un nouveau lien depuis la page de connexion.', false);
    return;
  }

  for (var i = 0; i < 12; i++) {
    var { data } = await db.auth.getSession();
    if (data && data.session) {
      sub.textContent = 'Choisissez votre nouveau mot de passe.';
      document.getElementById('form').style.display = 'block';
      history.replaceState(null, '', window.location.pathname);
      return;
    }
    await new Promise(function(r) { setTimeout(r, 250); });
  }

  sub.textContent = 'Lien expiré ou déjà utilisé.';
  show('Le lien de réinitialisation n\u2019est plus valide. Retournez à la page de connexion et demandez-en un nouveau.', false);
})();

async function submitPassword() {
  var pw1 = document.getElementById('pw1').value;
  var pw2 = document.getElementById('pw2').value;
  var btn = document.getElementById('btn');

  if (pw1.length < 8) { show('Le mot de passe doit faire au moins 8 caractères.', false); return; }
  if (pw1 !== pw2)    { show('Les deux mots de passe ne correspondent pas.', false); return; }

  btn.disabled = true;
  btn.textContent = 'Enregistrement…';

  var res = await db.auth.updateUser({ password: pw1 });

  if (res.error) {
    btn.disabled = false;
    btn.textContent = 'Enregistrer';
    show('Erreur : ' + res.error.message, false);
    return;
  }

  document.getElementById('form').style.display = 'none';
  document.getElementById('sub').textContent = 'C\u2019est fait.';
  show('Mot de passe modifié. Redirection vers la connexion…', true);
  setTimeout(function() { window.location.href = 'forestrangers-login.html'; }, 1800);
}
</script>

</body>
</html>
