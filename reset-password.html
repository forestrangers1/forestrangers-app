<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Rangers — Nouveau mot de passe</title>
<script>
/* Theme partage (cle 'fr-theme') : clair par defaut. Cette page est atteinte
   depuis un lien email, dans le meme parcours que le login. */
try { if (localStorage.getItem('fr-theme') !== 'dark') document.documentElement.classList.add('light'); } catch(e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Repli CDN : si jsDelivr n'a pas repondu, on tente unpkg avant d'abandonner. -->
<script>if (!window.supabase) { document.write('<scr' + 'ipt src="https://unpkg.com/@supabase/supabase-js@2"><\/scr' + 'ipt>'); }</script>
<script>
  // ── Init resiliente (correctif : "Cannot access 'db' before initialization") ──
  // Le SDK Supabase vient d'un CDN. Sur reseau faible il peut ne pas arriver :
  // window.supabase est alors indefini, l'ancien `const db` restait en zone morte
  // et chaque appel renvoyait une erreur incomprehensible. On declare `db` en `var`
  // (jamais de zone morte) et on affiche un message clair si le SDK manque.
  var SUPABASE_URL = 'https://zxzhqptimjvdtvvtnpyw.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_drh_w_i9T4GOZ_AzoqkLcw_SW45X1FT';
  var db = null;

  function frErreurReseau(detail) {
    if (document.getElementById('fr-offline-overlay')) return;
    var html = '<div id="fr-offline-overlay" style="position:fixed;inset:0;z-index:99999;'
      + 'background:#1c1f14;color:#eceee6;display:flex;align-items:center;justify-content:center;'
      + 'padding:24px;font-family:\'Instrument Sans\',system-ui,sans-serif;text-align:center;">'
      + '<div style="max-width:340px;">'
      + '<div style="font-size:34px;margin-bottom:14px;">📡</div>'
      + '<div style="font-size:17px;font-weight:600;margin-bottom:10px;">Connexion au serveur impossible</div>'
      + '<div style="font-size:13.5px;line-height:1.6;color:rgba(236,238,230,0.6);margin-bottom:20px;">'
      + 'Votre reseau ne permet pas de charger l\'application. Verifiez votre connexion, '
      + 'passez en wifi si possible, puis reessayez.</div>'
      + '<button onclick="location.reload()" style="background:#ff5f1f;color:#fff;border:0;'
      + 'border-radius:10px;padding:13px 26px;font-size:14px;font-weight:600;cursor:pointer;">'
      + 'Reessayer</button>'
      + '<div style="font-size:10.5px;color:rgba(236,238,230,0.25);margin-top:16px;">'
      + (detail || 'SDK Supabase indisponible') + '</div>'
      + '</div></div>';
    function poser() { document.body.insertAdjacentHTML('beforeend', html); }
    if (document.body) poser(); else document.addEventListener('DOMContentLoaded', poser);
  }

  if (window.supabase && window.supabase.createClient) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        storageKey: 'fr-auth',
        storage: window.localStorage,
        // verrou neutralise : evite les erreurs Navigator Lock / DataCloneError sur mobile
        lock: async (_name, _acquireTimeout, fn) => await fn()
      }
    });
  } else {
    frErreurReseau();
  }
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #ff5f1f;
  --bg:     #1c1f14;
  --s1:     #252a1a;
  --bd:     rgba(255,255,255,0.07);
  --bd2:    rgba(255,255,255,0.13);
  --tx:     #eceee6;
  --td:     rgba(236,238,230,0.55);
  --green:  #5ec97a;
  --r:      12px;
}

/* ── MODE CLAIR (classe html.light, cle 'fr-theme' partagee) ── */
html.light {
  --bg:    #f4f5f0;
  --s1:    #ffffff;
  --bd:    rgba(0,0,0,0.08);
  --bd2:   rgba(0,0,0,0.15);
  --tx:    #1c1f14;
  --td:    rgba(28,31,20,0.58);
  --green: #2e7d32;
}
html.light body { background: var(--bg); color: var(--tx); }
html, body {
  min-height: 100vh;
  font-family: 'Instrument Sans', sans-serif;
  background: var(--bg);
  color: var(--tx);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  width: 100%;
  max-width: 400px;
  background: var(--s1);
  border: 1px solid var(--bd);
  border-radius: var(--r);
  padding: 32px 28px;
}
h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.sub { color: var(--td); font-size: 13px; margin-bottom: 24px; line-height: 1.5; }
label { display: block; font-size: 12px; color: var(--td); margin-bottom: 6px; }
input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--bd2);
  border-radius: 8px;
  color: var(--tx);
  font-family: inherit;
  font-size: 14px;
  margin-bottom: 16px;
}
input:focus { outline: none; border-color: var(--accent); }
button {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
button:disabled { opacity: 0.5; cursor: not-allowed; }
.msg {
  display: none;
  padding: 11px 13px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  line-height: 1.45;
  background: rgba(255,95,31,0.12);
  border: 1px solid rgba(255,95,31,0.25);
  color: #ffb08a;
}
.msg.ok {
  background: rgba(94,201,122,0.12);
  border-color: rgba(94,201,122,0.25);
  color: var(--green);
}
.back { display: block; text-align: center; margin-top: 18px; color: var(--td); font-size: 13px; text-decoration: none; }
.back:hover { color: var(--tx); }
</style>
</head>
<body>

<div class="card">
  <h1>Nouveau mot de passe</h1>
  <p class="sub" id="sub">Vérification du lien en cours…</p>

  <div class="msg" id="msg"></div>

  <div id="form" style="display:none;">
    <label for="pw1">Nouveau mot de passe</label>
    <input type="password" id="pw1" autocomplete="new-password" placeholder="8 caractères minimum">

    <label for="pw2">Confirmation</label>
    <input type="password" id="pw2" autocomplete="new-password" placeholder="Retapez le mot de passe">

    <button id="btn" onclick="submitPassword()">Enregistrer</button>
  </div>

  <a class="back" href="forestrangers-login.html">Retour à la connexion</a>
</div>

<script>
function show(text, ok) {
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = ok ? 'msg ok' : 'msg';
  m.style.display = 'block';
}

// Un lien de recuperation Supabase arrive sous l'une de ces trois formes :
//   A. #access_token=...&refresh_token=...&type=recovery   (flux implicite)
//   B. ?token_hash=...&type=recovery                        (templates recents)
//   C. ?code=...                                            (flux PKCE)
// On les traite explicitement plutot que de dependre de detectSessionInUrl.
(async function init() {
  var sub = document.getElementById('sub');

  var qs   = new URLSearchParams(window.location.search);
  var hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));

  // Erreur renvoyee directement par Supabase
  var errDesc = qs.get('error_description') || hash.get('error_description');
  if (errDesc) {
    sub.textContent = 'Ce lien n\u2019a pas pu etre utilise.';
    show(decodeURIComponent(errDesc), false);
    return;
  }

  var result = null;

  try {
    if (hash.get('access_token') && hash.get('refresh_token')) {
      result = await db.auth.setSession({
        access_token:  hash.get('access_token'),
        refresh_token: hash.get('refresh_token')
      });
    } else if (qs.get('token_hash')) {
      result = await db.auth.verifyOtp({
        token_hash: qs.get('token_hash'),
        type: qs.get('type') || 'recovery'
      });
    } else if (qs.get('token') && qs.get('type')) {
      result = await db.auth.verifyOtp({
        token: qs.get('token'),
        type: qs.get('type'),
        email: qs.get('email') || undefined
      });
    } else if (qs.get('code')) {
      result = await db.auth.exchangeCodeForSession(qs.get('code'));
    } else {
      // Aucun jeton : on n'affiche PAS le formulaire. Une session admin deja
      // ouverte dans le meme navigateur ne doit pas faire croire a un lien valide.
      sub.textContent = 'Aucun jeton dans le lien.';
      show('L\u2019adresse ouverte ne contient aucun jeton de recuperation. '
         + 'Ouvrez le lien directement depuis l\u2019email.'
         + ' [diagnostic : ' + (window.location.search || '(pas de query)')
         + ' ' + (window.location.hash || '(pas de fragment)') + ']', false);
      return;
    }
  } catch (e) {
    result = { error: e };
  }

  if (!result || result.error) {
    var m = (result && result.error && result.error.message) ? result.error.message : 'erreur inconnue';
    sub.textContent = 'Le lien n\u2019a pas pu etre valide.';
    show('Detail technique : ' + m, false);
    console.error('Echec validation du lien de recuperation:', result && result.error);
    return;
  }

  sub.textContent = 'Choisissez votre nouveau mot de passe.';
  document.getElementById('form').style.display = 'block';
  // L'URL n'est nettoyee qu'apres changement effectif du mot de passe,
  // pour rester diagnosticable en cas d'echec.
})();

async function submitPassword() {
  var pw1 = document.getElementById('pw1').value;
  var pw2 = document.getElementById('pw2').value;
  var btn = document.getElementById('btn');

  if (pw1.length < 8) { show('Le mot de passe doit faire au moins 8 caractères.', false); return; }
  if (pw1 !== pw2)    { show('Les deux mots de passe ne correspondent pas.', false); return; }

  btn.disabled = true;
  btn.textContent = 'Enregistrement…';

  var res = await db.auth.updateUser({ password: pw1 });

  if (res.error) {
    btn.disabled = false;
    btn.textContent = 'Enregistrer';
    show('Erreur : ' + res.error.message, false);
    return;
  }

  history.replaceState(null, '', window.location.pathname);
  document.getElementById('form').style.display = 'none';
  document.getElementById('sub').textContent = 'C\u2019est fait.';
  show('Mot de passe modifié. Redirection vers la connexion…', true);
  setTimeout(function() { window.location.href = 'forestrangers-login.html'; }, 1800);
}
</script>

</body>
</html>
