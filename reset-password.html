<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Rangers — Nouveau mot de passe</title>
<script>
/* Theme partage (cle 'fr-theme') : clair par defaut. Cette page est atteinte
   depuis un lien email, dans le meme parcours que le login. */
try { if (localStorage.getItem('fr-theme') !== 'dark') document.documentElement.classList.add('light'); } catch(e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Repli CDN : si jsDelivr n'a pas repondu, on tente unpkg avant d'abandonner. -->
<script>if (!window.supabase) { document.write('<scr' + 'ipt src="https://unpkg.com/@supabase/supabase-js@2"><\/scr' + 'ipt>'); }</script>
<script>
  // ── Init resiliente (correctif : "Cannot access 'db' before initialization") ──
  // Le SDK Supabase vient d'un CDN. Sur reseau faible il peut ne pas arriver :
  // window.supabase est alors indefini, l'ancien `const db` restait en zone morte
  // et chaque appel renvoyait une erreur incomprehensible. On declare `db` en `var`
  // (jamais de zone morte) et on affiche un message clair si le SDK manque.
  var SUPABASE_URL = 'https://zxzhqptimjvdtvvtnpyw.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_drh_w_i9T4GOZ_AzoqkLcw_SW45X1FT';
  var db = null;

  function frErreurReseau(detail) {
    if (document.getElementById('fr-offline-overlay')) return;
    var html = '<div id="fr-offline-overlay" style="position:fixed;inset:0;z-index:99999;'
      + 'background:#1c1f14;color:#eceee6;display:flex;align-items:center;justify-content:center;'
      + 'padding:24px;font-family:\'Instrument Sans\',system-ui,sans-serif;text-align:center;">'
      + '<div style="max-width:340px;">'
      + '<div style="font-size:34px;margin-bottom:14px;">📡</div>'
      + '<div style="font-size:17px;font-weight:600;margin-bottom:10px;">Connexion au serveur impossible</div>'
      + '<div style="font-size:13.5px;line-height:1.6;color:rgba(236,238,230,0.6);margin-bottom:20px;">'
      + 'Votre reseau ne permet pas de charger l\'application. Verifiez votre connexion, '
      + 'passez en wifi si possible, puis reessayez.</div>'
      + '<button onclick="location.reload()" style="background:#ff5f1f;color:#fff;border:0;'
      + 'border-radius:10px;padding:13px 26px;font-size:14px;font-weight:600;cursor:pointer;">'
      + 'Reessayer</button>'
      + '<div style="font-size:10.5px;color:rgba(236,238,230,0.25);margin-top:16px;">'
      + (detail || 'SDK Supabase indisponible') + '</div>'
      + '</div></div>';
    function poser() { document.body.insertAdjacentHTML('beforeend', html); }
    if (document.body) poser(); else document.addEventListener('DOMContentLoaded', poser);
  }

  if (window.supabase && window.supabase.createClient) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        storageKey: 'fr-auth',
        storage: window.localStorage,
        // verrou neutralise : evite les erreurs Navigator Lock / DataCloneError sur mobile
        lock: async (_name, _acquireTimeout, fn) => await fn()
      }
    });
  } else {
    frErreurReseau();
  }
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #ff5f1f;
  --bg:     #1c1f14;
  --s1:     #252a1a;
  --bd:     rgba(255,255,255,0.07);
  --bd2:    rgba(255,255,255,0.13);
  --tx:     #eceee6;
  --td:     rgba(236,238,230,0.55);
  --green:  #5ec97a;
  --r:      12px;
}

/* ── MODE CLAIR (classe html.light, cle 'fr-theme' partagee) ── */
html.light {
  --bg:    #f4f5f0;
  --s1:    #ffffff;
  --bd:    rgba(0,0,0,0.08);
  --bd2:   rgba(0,0,0,0.15);
  --tx:    #1c1f14;
  --td:    rgba(28,31,20,0.58);
  --green: #2e7d32;
}
html.light body { background: var(--bg); color: var(--tx); }
html, body {
  min-height: 100vh;
  font-family: 'Instrument Sans', sans-serif;
  background: var(--bg);
  color: var(--tx);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  width: 100%;
  max-width: 400px;
  background: var(--s1);
  border: 1px solid var(--bd);
  border-radius: var(--r);
  padding: 32px 28px;
}
h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.sub { color: var(--td); font-size: 13px; margin-bottom: 24px; line-height: 1.5; }
label { display: block; font-size: 12px; color: var(--td); margin-bottom: 6px; }
input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--bd2);
  border-radius: 8px;
  color: var(--tx);
  font-family: inherit;
  font-size: 14px;
  margin-bottom: 16px;
}
input:focus { outline: none; border-color: var(--accent); }
button {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
button:disabled { opacity: 0.5; cursor: not-allowed; }
.msg {
  display: none;
  padding: 11px 13px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  line-height: 1.45;
  background: rgba(255,95,31,0.12);
  border: 1px solid rgba(255,95,31,0.25);
  color: #ffb08a;
}
.msg.ok {
  background: rgba(94,201,122,0.12);
  border-color: rgba(94,201,122,0.25);
  color: var(--green);
}
.back { display: block; text-align: center; margin-top: 18px; color: var(--td); font-size: 13px; text-decoration: none; }
.back:hover { color: var(--tx); }
</style>
<script>
// ════════════════════════════════════════════════════════════════
//  LANGUE DE LA PAGE (v2.48) — français ou anglais (même moteur que l'espace client)
//  Règle de Gabriel : langue « fr » → français ; toute autre langue
//  (en, lu, de…) → anglais. Le client peut changer dans Paramètres.
//  Le français reste la langue source : chaque texte affiché garde son
//  original en mémoire, la traduction se fait à l'affichage (dictionnaire
//  exact, puis fragments pour les phrases composées : dates, nombres).
//  Ce que le client écrit est toujours enregistré tel quel ; les messages
//  de Gabriel et les notes restent dans leur langue (data-i18n-off).
//  Factures PDF, emails et CGV restent en français.
// ════════════════════════════════════════════════════════════════
(function () {
  'use strict';
  var DICT = {"Connexion au serveur impossible": "Cannot connect to the server", "Votre reseau ne permet pas de charger l'application. Verifiez votre connexion,": "Your network cannot load the app. Check your connection,", "Votre reseau ne permet pas de charger l'application. Verifiez votre connexion, passez en wifi si possible, puis reessayez.": "Your network cannot load the app. Check your connection, switch to wifi if possible, then try again.", "passez en wifi si possible, puis reessayez.": "switch to wifi if possible, then try again.", "Reessayer": "Try again", "SDK Supabase indisponible": "Service unavailable", "Nouveau mot de passe": "New password", "Vérification du lien en cours…": "Checking the link…", "8 caractères minimum": "8 characters minimum", "Confirmation": "Confirmation", "Retapez le mot de passe": "Type the password again", "Enregistrer": "Save", "Enregistrement…": "Saving…", "Retour à la connexion": "Back to login", "Ce lien n’a pas pu etre utilise.": "This link could not be used.", "Aucun jeton dans le lien.": "No token in the link.", "Le lien n’a pas pu etre valide.": "The link could not be validated.", "Choisissez votre nouveau mot de passe.": "Choose your new password.", "Le mot de passe doit faire au moins 8 caractères.": "The password must be at least 8 characters long.", "Les deux mots de passe ne correspondent pas.": "The two passwords do not match.", "C’est fait.": "Done.", "Mot de passe modifié. Redirection vers la connexion…": "Password changed. Redirecting to login…"};
  var FRAG = [["L’adresse ouverte ne contient aucun jeton de recuperation.", "The address opened contains no recovery token."], ["Ouvrez le lien directement depuis l’email.", "Open the link directly from the email."], ["Detail technique :", "Technical detail:"], ["erreur inconnue", "unknown error"], ["Erreur :", "Error:"]];
  var LETTRE = /[A-Za-zÀ-ÖØ-öø-ÿ]/;
  var lang = ((function () { try { var v = localStorage.getItem('fr-client-lang'); if (v === 'en' || v === 'fr') return v; } catch (e) {} return null; })() || ((navigator.language || 'fr').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en'));
  var SKIP = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, INPUT: 1 };
  var occupe = false;

  function sa(s) { return String(s || '').normalize ? String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '') : String(s || ''); }
  function norm(s) { return String(s).replace(/\s+/g, ' ').trim(); }
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  var RX = FRAG.map(function (p) {
    var a = p[0], deb = LETTRE.test(a.charAt(0)) ? '(^|[^A-Za-zÀ-ÖØ-öø-ÿ])' : '()', fin = LETTRE.test(a.charAt(a.length - 1)) ? '(?![A-Za-zÀ-ÖØ-öø-ÿ])' : '';
    return { a: a, re: new RegExp(deb + esc(a) + fin, 'g'), b: p[1] };
  });
  function traduire(fr) {
    var k = norm(fr);
    if (!k) return fr;
    if (DICT[k] != null) return DICT[k];
    if (!/[a-zà-ÿ]{2}/i.test(k)) return k;
    var out = k;
    for (var i = 0; i < RX.length; i++) {
      if (out.indexOf(RX[i].a) === -1) continue;
      out = out.replace(RX[i].re, function (m, avant) { return (avant || '') + RX[i].b; });
    }
    // Prépositions devant une date ou un nombre
    out = out.replace(/(^|[^A-Za-zÀ-ÖØ-öø-ÿ])avant le (?=\d)/g, '$1before ')
             .replace(/(^|[^A-Za-zÀ-ÖØ-öø-ÿ])le (?=\d)/g, '$1on ').replace(/(^|[^A-Za-zÀ-ÖØ-öø-ÿ])Le (?=\d)/g, '$1On ')
             .replace(/(^|[^A-Za-zÀ-ÖØ-öø-ÿ])du (?=\d)/g, '$1from ').replace(/(^|[^A-Za-zÀ-ÖØ-öø-ÿ])Du (?=\d)/g, '$1From ')
             .replace(/(^|[^A-Za-zÀ-ÖØ-öø-ÿ])au (?=\d)/g, '$1to ').replace(/(\d) h (\d)/g, '$1:$2');
    return out;
  }
  function t(fr) { return lang === 'en' ? traduire(fr) : fr; }
  function exclu(n) { var p = n.parentElement; return !p || SKIP[p.nodeName] || !!p.closest('[data-i18n-off]'); }

  function noeud(n) {
    if (exclu(n)) return;
    var v = n.nodeValue;
    if (!v || !v.trim()) return;
    if (n._fr == null) n._fr = v;
    else if (!(v === n._aff || v === sa(n._aff))) n._fr = v;     // le code a réécrit le texte
    var brut = n._fr, avant = (brut.match(/^\s*/) || [''])[0], apres = (brut.match(/\s*$/) || [''])[0];
    var cible = lang === 'en' ? avant + traduire(brut) + apres : brut;
    n._aff = cible;
    if (v !== cible && v !== sa(cible)) { occupe = true; n.nodeValue = cible; occupe = false; }
  }
  function attrs(el) {
    ['placeholder', 'title', 'aria-label'].forEach(function (a) {
      if (!el.hasAttribute || !el.hasAttribute(a)) return;
      var k = 'i18n' + a.replace(/-/g, ''), v = el.getAttribute(a);
      if (el.dataset[k] == null || (v !== el.dataset[k + 'Aff'])) el.dataset[k] = v;
      var cible = lang === 'en' ? traduire(el.dataset[k]) : el.dataset[k];
      el.dataset[k + 'Aff'] = cible;
      if (v !== cible) { occupe = true; el.setAttribute(a, cible); occupe = false; }
    });
  }
  function scan(root) {
    if (!root) return;
    if (root.nodeType === 3) { noeud(root); return; }
    if (root.nodeType !== 1 || root.closest && root.closest('[data-i18n-off]')) return;
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false), n;
    while ((n = w.nextNode())) noeud(n);
    attrs(root);
    var els = root.querySelectorAll ? root.querySelectorAll('[placeholder],[title],[aria-label]') : [];
    for (var i = 0; i < els.length; i++) attrs(els[i]);
  }
  function demarrer() {
    document.documentElement.setAttribute('lang', lang);
    scan(document.body);
    new MutationObserver(function (muts) {
      if (occupe) return;
      muts.forEach(function (m) {
        if (m.type === 'characterData') noeud(m.target);
        else if (m.type === 'attributes') attrs(m.target);
        else for (var i = 0; i < m.addedNodes.length; i++) scan(m.addedNodes[i]);
      });
    }).observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['placeholder', 'title', 'aria-label'] });
  }
  function choisir(l) {
    l = l === 'en' ? 'en' : 'fr';
    try { localStorage.setItem('fr-client-lang', l); } catch (e) {}
    if (l === lang) return;
    lang = l;
    document.documentElement.setAttribute('lang', lang);
    scan(document.body);
  }
  // Boîtes de dialogue du navigateur (confirmations, alertes)
  ['alert', 'confirm', 'prompt'].forEach(function (f) {
    var orig = window[f];
    window[f] = function (msg) {
      var args = Array.prototype.slice.call(arguments);
      if (lang === 'en' && typeof msg === 'string') args[0] = msg.split('\n').map(function (l) { return l.trim() ? traduire(l) : l; }).join('\n');
      return orig.apply(window, args);
    };
  });
  window.FR_LANG = {
    t: t, choisir: choisir, langue: function () { return lang; },
    // Langue de la fiche client : « fr » → français, toute autre → anglais
    depuisClient: function (langue) { choisir(langue && String(langue).toLowerCase() !== 'fr' ? 'en' : 'fr'); }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer); else demarrer();
})();

</script>
</head>
<body>

<div class="card">
  <h1>Nouveau mot de passe</h1>
  <p class="sub" id="sub">Vérification du lien en cours…</p>

  <div class="msg" id="msg"></div>

  <div id="form" style="display:none;">
    <label for="pw1">Nouveau mot de passe</label>
    <input type="password" id="pw1" autocomplete="new-password" placeholder="8 caractères minimum">

    <label for="pw2">Confirmation</label>
    <input type="password" id="pw2" autocomplete="new-password" placeholder="Retapez le mot de passe">

    <button id="btn" onclick="submitPassword()">Enregistrer</button>
  </div>

  <a class="back" href="forestrangers-login.html">Retour à la connexion</a>
</div>

<script>
function show(text, ok) {
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = ok ? 'msg ok' : 'msg';
  m.style.display = 'block';
}

// Un lien de recuperation Supabase arrive sous l'une de ces trois formes :
//   A. #access_token=...&refresh_token=...&type=recovery   (flux implicite)
//   B. ?token_hash=...&type=recovery                        (templates recents)
//   C. ?code=...                                            (flux PKCE)
// On les traite explicitement plutot que de dependre de detectSessionInUrl.
(async function init() {
  var sub = document.getElementById('sub');

  var qs   = new URLSearchParams(window.location.search);
  var hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));

  // Erreur renvoyee directement par Supabase
  var errDesc = qs.get('error_description') || hash.get('error_description');
  if (errDesc) {
    sub.textContent = 'Ce lien n\u2019a pas pu etre utilise.';
    show(decodeURIComponent(errDesc), false);
    return;
  }

  var result = null;

  try {
    if (hash.get('access_token') && hash.get('refresh_token')) {
      result = await db.auth.setSession({
        access_token:  hash.get('access_token'),
        refresh_token: hash.get('refresh_token')
      });
    } else if (qs.get('token_hash')) {
      result = await db.auth.verifyOtp({
        token_hash: qs.get('token_hash'),
        type: qs.get('type') || 'recovery'
      });
    } else if (qs.get('token') && qs.get('type')) {
      result = await db.auth.verifyOtp({
        token: qs.get('token'),
        type: qs.get('type'),
        email: qs.get('email') || undefined
      });
    } else if (qs.get('code')) {
      result = await db.auth.exchangeCodeForSession(qs.get('code'));
    } else {
      // Aucun jeton : on n'affiche PAS le formulaire. Une session admin deja
      // ouverte dans le meme navigateur ne doit pas faire croire a un lien valide.
      sub.textContent = 'Aucun jeton dans le lien.';
      show('L\u2019adresse ouverte ne contient aucun jeton de recuperation. '
         + 'Ouvrez le lien directement depuis l\u2019email.'
         + ' [diagnostic : ' + (window.location.search || '(pas de query)')
         + ' ' + (window.location.hash || '(pas de fragment)') + ']', false);
      return;
    }
  } catch (e) {
    result = { error: e };
  }

  if (!result || result.error) {
    var m = (result && result.error && result.error.message) ? result.error.message : 'erreur inconnue';
    sub.textContent = 'Le lien n\u2019a pas pu etre valide.';
    show('Detail technique : ' + m, false);
    console.error('Echec validation du lien de recuperation:', result && result.error);
    return;
  }

  sub.textContent = 'Choisissez votre nouveau mot de passe.';
  document.getElementById('form').style.display = 'block';
  // L'URL n'est nettoyee qu'apres changement effectif du mot de passe,
  // pour rester diagnosticable en cas d'echec.
})();

async function submitPassword() {
  var pw1 = document.getElementById('pw1').value;
  var pw2 = document.getElementById('pw2').value;
  var btn = document.getElementById('btn');

  if (pw1.length < 8) { show('Le mot de passe doit faire au moins 8 caractères.', false); return; }
  if (pw1 !== pw2)    { show('Les deux mots de passe ne correspondent pas.', false); return; }

  btn.disabled = true;
  btn.textContent = 'Enregistrement…';

  var res = await db.auth.updateUser({ password: pw1 });

  if (res.error) {
    btn.disabled = false;
    btn.textContent = 'Enregistrer';
    show('Erreur : ' + res.error.message, false);
    return;
  }

  history.replaceState(null, '', window.location.pathname);
  document.getElementById('form').style.display = 'none';
  document.getElementById('sub').textContent = 'C\u2019est fait.';
  show('Mot de passe modifié. Redirection vers la connexion…', true);
  setTimeout(function() { window.location.href = 'forestrangers-login.html'; }, 1800);
}
</script>

</body>
</html>
